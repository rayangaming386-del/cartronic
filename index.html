        $('[data-e="stock"]', form).textContent = e.stock || '';
        form.regular.setAttribute('aria-invalid', String(!!e.regularPrice));
        form.value.setAttribute('aria-invalid', String(!!(e.salePrice || e.discountValue)));
        const pv = $('[data-preview]', form);
        if (!Object.keys(e).length) { const c = Pricing.calc(p); pv.innerHTML = `Klantprijs: <strong>${Money.fmt(c.price)}</strong>${c.onSale ? ` (−${c.pct}%)` : ''}${Pricing.promoState(p) === 'scheduled' ? ' · actie gepland' : ''}`; } else pv.textContent = '';
        return e;
      };
      form.type.addEventListener('change', () => { form.value.disabled = form.type.value === 'none'; if (form.type.value === 'none') form.value.value = ''; form.value.placeholder = form.type.value === 'percent' ? 'bijv. 10' : 'bijv. 249,00'; preview(); });
      form.track.addEventListener('change', () => { form.stock.disabled = !form.track.checked; preview(); });
      form.addEventListener('input', preview);
      $('[data-qe-cancel]', form).addEventListener('click', () => { st.open = null; draw(); });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const errs = preview();
        if (Object.keys(errs).length) { Toast.show('Controleer de invoer.', { error: true }); return; }
        Repo.saveProduct(read());
        st.open = null; draw();
        Toast.show('Product bijgewerkt.');
      });
      preview();
      form.regular.focus();
    };
    root.addEventListener('click', async (e) => {
      const o = e.target.closest('[data-qe-open]');
      if (o) { st.open = st.open === o.dataset.qeOpen ? null : o.dataset.qeOpen; draw(); return; }
      const a = e.target.closest('[data-archive]');
      if (a) {
        const p = Repo.product(a.dataset.archive);
        if (await Overlay.confirm({ title: 'Product archiveren?', message: `“${esc(p.name)}” verdwijnt uit de webshop. Bestellingen behouden hun gegevens. U kunt het product later herstellen.`, confirmLabel: 'Archiveren' })) {
          Repo.saveProduct({ ...p, archived: true, active: false, featured: false }); draw(); Toast.show('Product gearchiveerd.');
        }
        return;
      }
      const r = e.target.closest('[data-restore]');
      if (r) { const p = Repo.product(r.dataset.restore); Repo.saveProduct({ ...p, archived: false }); draw(); Toast.show('Product hersteld (inactief). Activeer het om het te tonen.'); return; }
      const d = e.target.closest('[data-delete]');
      if (d) {
        const p = Repo.product(d.dataset.delete);
        if (productInOrders(p.id)) { Toast.show('Dit product komt voor in bestellingen. Archiveer het in plaats van verwijderen.', { error: true }); return; }
        if (await Overlay.confirm({ title: 'Product definitief verwijderen?', message: `“${esc(p.name)}” wordt permanent verwijderd. Dit kan niet ongedaan worden gemaakt.`, confirmLabel: 'Verwijderen', danger: true })) {
          Repo.deleteProduct(p.id); draw(); Toast.show('Product verwijderd.');
        }
      }
    });
    const syncQ = () => Router.setQuery({ q: st.q, f: st.f !== 'alle' ? st.f : '', c: st.c });
    $('[data-q]', root).addEventListener('input', debounce((e) => { st.q = e.target.value.trim(); syncQ(); draw(); }, 200));
    $('[data-f]', root).addEventListener('change', (e) => { st.f = e.target.value; syncQ(); draw(); });
    $('[data-c]', root).addEventListener('change', (e) => { st.c = e.target.value; syncQ(); draw(); });
    draw();
  },
});

              ${p.archived ? UI.notice('Dit product is gearchiveerd en niet zichtbaar in de webshop.', { ic: 'archive' }) : ''}
            </div></section>

            <section class="panel"><div class="panel-head"><h2>Prijs en korting</h2></div><div class="panel-body" style="display:grid;gap:18px">
              <div class="field"><label for="pf-regularPrice">Normale prijs</label><div class="input-affix"><span class="affix">€</span><input class="input" id="pf-regularPrice" data-raw="regularPrice" inputmode="decimal" value="${attr(raw.regularPrice)}" placeholder="249,00"${inv('regularPrice')}></div>${err('regularPrice')}</div>
              <div class="field"><span class="label">Korting</span><div class="radio-row" role="radiogroup" aria-label="Kortingstype">${[['none', 'Geen'], ['sale', 'Actieprijs'], ['percent', 'Percentage'], ['fixed', 'Vast bedrag']].map(([k, l]) => `<label class="radio-tile"><input type="radio" name="dtype" value="${k}"${p.discountType === k ? ' checked' : ''} data-dtype><span>${l}</span></label>`).join('')}</div></div>
              ${p.discountType === 'sale' ? `<div class="field"><label for="pf-salePrice">Actieprijs</label><div class="input-affix"><span class="affix">€</span><input class="input" id="pf-salePrice" data-raw="salePrice" inputmode="decimal" value="${attr(raw.salePrice)}"${inv('salePrice')}></div>${err('salePrice')}</div>` : ''}
              ${p.discountType === 'percent' ? `<div class="field"><label for="pf-discountValue">Kortingspercentage</label><div class="input-affix"><input class="input" id="pf-discountValue" data-raw="percent" inputmode="numeric" value="${attr(raw.percent)}"${inv('discountValue')} style="border-radius:var(--radius) 0 0 var(--radius)"><span class="affix affix--end">%</span></div>${err('discountValue')}</div>` : ''}
              ${p.discountType === 'fixed' ? `<div class="field"><label for="pf-discountValue">Vaste korting</label><div class="input-affix"><span class="affix">€</span><input class="input" id="pf-discountValue" data-raw="fixed" inputmode="decimal" value="${attr(raw.fixed)}"${inv('discountValue')}></div>${err('discountValue')}</div>` : ''}

            ${!isNew ? `<section class="panel"><div class="panel-head"><h2>Beheer</h2></div><div class="panel-body" style="display:grid;gap:10px">
              ${p.archived ? '<button class="btn btn--light btn--sm" type="button" data-restore>Herstellen uit archief</button>' : '<button class="btn btn--light btn--sm" type="button" data-archive>Archiveren</button>'}

        <div class="save-bar"><span class="sb-status${dirty ? ' is-dirty' : ''}" data-sb>${dirty ? 'Niet-opgeslagen wijzigingen' : (isNew ? 'Nieuw product' : 'Alle wijzigingen opgeslagen')}</span>
          <div class="sb-actions"><a class="btn btn--light btn--sm" href="#/admin/producten">Annuleren</a><button class="btn btn--primary btn--sm" type="button" data-save>${isNew ? 'Product aanmaken' : 'Opslaan'}</button></div></div>`;
    };
    const markDirty = () => { dirty = true; const sb = $('[data-sb]', host); if (sb) { sb.textContent = 'Niet-opgeslagen wijzigingen'; sb.classList.add('is-dirty'); } };
    const parseRaw = () => {
      p.regularPrice = Money.parse(raw.regularPrice);
      if (p.discountType === 'sale') { p.salePrice = Money.parse(raw.salePrice); p.discountValue = null; }
      else if (p.discountType === 'percent') { p.discountValue = /^\d{1,2}$/.test(raw.percent.trim()) ? parseInt(raw.percent, 10) : NaN; p.salePrice = null; }
      else if (p.discountType === 'fixed') { p.discountValue = Money.parse(raw.fixed); p.salePrice = null; }
      else { p.salePrice = null; p.discountValue = null; }
      p.stock = p.trackStock ? (raw.stock.trim() === '' ? NaN : Number(raw.stock)) : (Number.isFinite(Number(raw.stock)) ? Number(raw.stock) : 0);
      errors = validateProduct(p);
    };
    const redraw = (focusSel) => {
      const active = document.activeElement && document.activeElement.id;
      parseRaw(); draw();
      const target = focusSel ? $(focusSel, host) : (active ? document.getElementById(active) : null);
      if (target) { target.focus(); if (target.setSelectionRange && target.type === 'text') { const l = target.value.length; try { target.setSelectionRange(l, l); } catch (e) { /* ignore */ } } }
    };
    parseRaw(); draw();
    host.addEventListener('input', (e) => {
      const t = e.target;
      if (t.dataset.k) {
        p[t.dataset.k] = t.value;
        if (t.dataset.k === 'name' && !slugTouched) { p.slug = slugify(t.value); const s = $('#pf-slug', host); if (s) s.value = p.slug; }
        if (t.dataset.k === 'slug') slugTouched = true;
      }
      if (t.dataset.raw) raw[t.dataset.raw] = t.value;
      if (t.matches('[data-cnote]')) p.compatibility.note = t.value;
      parseRaw(); markDirty();
      if (showErrors) { // live inline error updates without full redraw
        $$('.field-error[id^="pf-"]', host).forEach((el) => { const k = el.id.slice(3, -2); el.textContent = errors[k] || ''; });
      }
      const pv = $('.price-preview', host);
      if (pv && (t.dataset.raw || t.dataset.k === 'startDate' || t.dataset.k === 'endDate')) {
        const valid = !Object.keys(errors).length || !['regularPrice', 'salePrice', 'discountValue', 'startDate', 'endDate'].some((k) => errors[k]);
        const promo = Pricing.promoState(p);
        pv.innerHTML = `<div class="pp-label">Zo ziet de klant het${promo === 'scheduled' ? ' (vanaf de startdatum)' : ''}</div>${Number.isFinite(p.regularPrice) && valid ? Pricing.html(promo === 'scheduled' ? { ...p, startDate: '' } : p) : '<span class="text-muted text-small">Vul geldige prijzen in voor een voorbeeld.</span>'}`;
      }
    });
    host.addEventListener('change', async (e) => {
      const t = e.target;
      if (t.matches('[data-dtype]')) { p.discountType = t.value; if (t.value === 'none') { p.startDate = ''; p.endDate = ''; } markDirty(); redraw(`[data-dtype][value="${t.value}"]`); return; }
      if (t.dataset.sw) { p[t.dataset.sw] = t.checked; markDirty(); if (t.dataset.sw === 'trackStock') redraw(`[data-sw="trackStock"]`); return; }
      if (t.matches('[data-cb]')) {
        const b = t.dataset.cb;
        p.compatibility.brands = t.checked ? uniq([...p.compatibility.brands, b]) : p.compatibility.brands.filter((x) => x !== b);
        p.compatibility.models = p.compatibility.models.filter((m) => !p.compatibility.brands.length || p.compatibility.brands.includes(MODEL[m].brand));
        markDirty(); redraw(`[data-cb="${b}"]`); return;
      }
      if (t.matches('[data-cm]')) { const m = t.dataset.cm; p.compatibility.models = t.checked ? uniq([...p.compatibility.models, m]) : p.compatibility.models.filter((x) => x !== m); markDirty(); return; }
      if (t.dataset.k === 'brand') { p.brand = t.value; if (p.model && MODEL[p.model].brand !== p.brand) p.model = ''; markDirty(); redraw('#pf-brand'); return; }
      if (t.dataset.k === 'category' || t.dataset.k === 'model' || t.dataset.k === 'type' || t.dataset.k === 'startDate' || t.dataset.k === 'endDate') { p[t.dataset.k] = t.value; markDirty(); if (t.dataset.k.endsWith('Date')) redraw(`#${t.id}`); return; }
      if (t.matches('[data-img-art]') && t.value) { p.images.push(`art:${t.value}:${p.images.length % 3}`); markDirty(); redraw('[data-img-art]'); return; }
      if (t.matches('[data-img-file]') && t.files && t.files[0]) {
        try {
          const dataUrl = await readImageFile(t.files[0]);
          p.images.push(dataUrl); markDirty(); redraw('[data-img-file]');
          Toast.show('Afbeelding toegevoegd (verkleind voor de demo).');
        } catch (er) { Toast.show(er.message, { error: true }); t.value = ''; }
      }
    });
    host.addEventListener('click', async (e) => {
      const f = e.target.closest('[data-focus]'); if (f) { e.preventDefault(); document.getElementById(f.dataset.focus)?.focus(); return; }
      if (e.target.closest('[data-img-add]')) {
        const inp = $('[data-img-url]', host); const url = inp.value.trim();
        if (!/^https:\/\/[^\s"'<>]+$/i.test(url)) { Toast.show('Gebruik een volledige https-URL naar een afbeelding.', { error: true }); inp.focus(); return; }
        p.images.push(url); markDirty(); redraw('[data-img-url]'); return;
      }
      const pr = e.target.closest('[data-img-primary]');
      if (pr) { const i = Number(pr.dataset.imgPrimary); const [img] = p.images.splice(i, 1); p.images.unshift(img); markDirty(); redraw(); return; }
      const rm = e.target.closest('[data-img-remove]');
      if (rm) { p.images.splice(Number(rm.dataset.imgRemove), 1); markDirty(); redraw(); return; }
      if (e.target.closest('[data-archive]')) {
        if (await Overlay.confirm({ title: 'Product archiveren?', message: 'Het product verdwijnt uit de webshop. Bestellingen behouden hun gegevens.', confirmLabel: 'Archiveren' })) {
          Repo.saveProduct({ ...Repo.product(p.id), archived: true, active: false, featured: false }); dirty = false; Router.setGuard(null); Toast.show('Product gearchiveerd.'); Router.go('/admin/producten');
        }
        return;
      }
      if (e.target.closest('[data-restore]')) { Repo.saveProduct({ ...Repo.product(p.id), archived: false }); dirty = false; Toast.show('Product hersteld (inactief).'); Router.render(); return; }
      if (e.target.closest('[data-delete]')) {
        if (productInOrders(p.id)) return;
        if (await Overlay.confirm({ title: 'Product definitief verwijderen?', message: 'Dit kan niet ongedaan worden gemaakt.', confirmLabel: 'Verwijderen', danger: true })) {
          Repo.deleteProduct(p.id); dirty = false; Router.setGuard(null); Toast.show('Product verwijderd.'); Router.go('/admin/producten');
        }
        return;
      }
      if (e.target.closest('[data-save]')) {
        parseRaw();
        if (Object.keys(errors).length) { showErrors = true; draw(); const s = $('[data-errsum]', host); if (s) s.focus(); Toast.show('Controleer de gemarkeerde velden.', { error: true }); return; }
        const toSave = { ...p, name: p.name.trim(), sku: p.sku.trim(), shortDescription: p.shortDescription.trim() };
        if (toSave.discountType === 'none') { toSave.startDate = ''; toSave.endDate = ''; }
        if (toSave.archived) toSave.active = false;
        const saved = Repo.saveProduct(toSave);
        dirty = false; Router.setGuard(null);
        Toast.show(isNew ? 'Product aangemaakt.' : 'Product opgeslagen.');
        if (isNew) Router.go(`/admin/producten/${saved.id}`); else Router.render();
      }
    });
    return () => Router.setGuard(null);
  },
});

Pages.adminCategories = adminPage({

            <button class="icon-btn icon-btn--sm" type="button" data-move="${c.id}" data-dir="1" aria-label="Omlaag"${i === cats.length - 1 ? ' disabled' : ''}>${icon('down')}</button>

      if (cats.some((c) => c.id !== id && c.name.toLowerCase() === name.toLowerCase())) { Toast.show('Deze naam bestaat al.', { error: true }); draw(); return; }
      save(cats.map((c) => (c.id === id ? { ...c, name } : c))); Toast.show('Categorie hernoemd.');

    });
    draw();
  },
});

Pages.adminPromos = adminPage({
  key: 'acties', title: 'Acties',
  render() {
    const products = Repo.products().filter((p) => !p.archived);
    return `<section class="panel"><div class="panel-head"><div><h2>Korting instellen</h2><p>Actieprijs, percentage of vast bedrag — met optionele start- en einddatum.</p></div></div>
        <div class="panel-body"><form class="form-grid" data-promo-form novalidate>
          <div class="field span-2"><label for="pr-prod">Product</label><select class="select" id="pr-prod" name="product"><option value="">Kies een product…</option>${products.map((p) => `<option value="${p.id}">${esc(p.name)} — ${Money.fmt(p.regularPrice)}</option>`).join('')}</select></div>
          <div class="field"><label for="pr-type">Soort korting</label><select class="select" id="pr-type" name="type"><option value="sale">Actieprijs (€)</option><option value="percent">Percentage (%)</option><option value="fixed">Vast bedrag (€)</option></select></div>
          <div class="field"><label for="pr-val">Waarde</label><input class="input" id="pr-val" name="value" inputmode="decimal" placeholder="bijv. 249,00"><span class="field-error" data-pe="value"></span></div>
          <div class="field"><label for="pr-start">Startdatum <span class="opt">(optioneel)</span></label><input class="input" type="date" id="pr-start" name="start"></div>
          <div class="field"><label for="pr-end">Einddatum <span class="opt">(optioneel)</span></label><input class="input" type="date" id="pr-end" name="end"><span class="field-error" data-pe="end"></span></div>
          <div class="span-2 flex wrap justify-between items-center gap-12"><div class="price-preview" style="flex:1;min-width:220px" data-pp><span class="text-muted text-small">Kies een product voor een voorbeeld.</span></div><button class="btn btn--primary" type="submit">Korting opslaan</button></div>
        </form></div></section>
      <section class="panel"><div class="panel-head"><h2>Producten met korting</h2></div><div class="panel-body panel-body--flush" data-promos></div></section>`;
  },
  mount(root) {
    const form = $('[data-promo-form]', root); const host = $('[data-promos]', root);
    const read = () => {
      const p = Repo.product(form.product.value); if (!p) return null;
      const d = deepClone(p); const v = form.value.value.trim();
      d.discountType = form.type.value; d.salePrice = null; d.discountValue = null;
      if (d.discountType === 'sale') d.salePrice = Money.parse(v);
      if (d.discountType === 'fixed') d.discountValue = Money.parse(v);
      if (d.discountType === 'percent') d.discountValue = /^\d{1,2}$/.test(v) ? parseInt(v, 10) : NaN;
      d.startDate = form.start.value; d.endDate = form.end.value;
      return d;
    };
    const preview = () => {
      const d = read(); const pp = $('[data-pp]', form);
      $('[data-pe="value"]', form).textContent = ''; $('[data-pe="end"]', form).textContent = '';
      if (!d) { pp.innerHTML = '<span class="text-muted text-small">Kies een product voor een voorbeeld.</span>'; return null; }
      const e = validateProduct(d);
      if (form.value.value.trim()) $('[data-pe="value"]', form).textContent = e.salePrice || e.discountValue || '';
      $('[data-pe="end"]', form).textContent = e.endDate || '';
      const state = Pricing.promoState(d);
      pp.innerHTML = Object.keys(e).length ? '<span class="text-muted text-small">Vul een geldige korting in.</span>' : `${Pricing.html(state === 'scheduled' ? { ...d, startDate: '' } : d)}${state === 'scheduled' ? '<p class="hint mt-8">Gepland: de korting start op de startdatum.</p>' : ''}${state === 'expired' ? '<p class="hint mt-8">Let op: deze periode is al verlopen.</p>' : ''}`;
      return e;
    };
    form.addEventListener('input', preview); form.addEventListener('change', (e) => {
      if (e.target.name === 'type') form.value.placeholder = e.target.value === 'percent' ? 'bijv. 15' : 'bijv. 249,00';
      if (e.target.name === 'product') {
        const p = Repo.product(form.product.value);

          form.type.value = p.discountType;

      Repo.saveProduct(d); Toast.show('Korting opgeslagen.'); form.reset(); preview(); draw();

          <td class="cell-main" data-label="Product"><a class="text-link" href="#/admin/producten/${p.id}">${esc(p.name)}</a></td>
          <td data-label="Korting">${esc(Pricing.describe(p))}</td>
          <td data-label="Periode" class="tabular">${p.startDate || p.endDate ? `${p.startDate ? fmtDate(`${p.startDate}T12:00:00`) : 'nu'} – ${p.endDate ? fmtDate(`${p.endDate}T12:00:00`) : 'onbepaald'}` : 'Doorlopend'}</td>
          <td data-label="Status"><span class="pill ${s === 'active' ? 'pill--red' : (s === 'scheduled' ? 'pill--info' : '')}">${{ active: 'Actief', scheduled: 'Gepland', expired: 'Verlopen' }[s]}</span></td>
          <td class="num" data-label="Klantprijs">${c.onSale ? `<span class="text-muted" style="text-decoration:line-through;font-size:12.5px">${Money.fmt(c.regular)}</span> ` : ''}<strong>${Money.fmt(c.price)}</strong></td>
          <td class="num cell-actions"><div class="row-actions"><button class="btn btn--ghost btn--xs" type="button" data-edit="${p.id}">${icon('pencil')} Wijzigen</button><button class="btn btn--ghost btn--xs" type="button" data-remove="${p.id}">${icon('x')} Korting verwijderen</button></div></td></tr>`; }).join('')}
        </tbody></table></div>` : `<div class="panel-body">${UI.empty({ icon: 'percent', title: 'Geen kortingen', text: 'Stel hierboven een korting in.' })}</div>`;
    };
    host.addEventListener('click', async (e) => {
      const ed = e.target.closest('[data-edit]');
      if (ed) { form.product.value = ed.dataset.edit; form.product.dispatchEvent(new Event('change', { bubbles: true })); form.scrollIntoView({ behavior: 'smooth', block: 'start' }); form.value.focus(); return; }
      const rm = e.target.closest('[data-remove]');
      if (rm) {
        const p = Repo.product(rm.dataset.remove);
        if (await Overlay.confirm({ title: 'Korting verwijderen?', message: `De normale prijs (${Money.fmt(p.regularPrice)}) van “${esc(p.name)}” geldt weer.`, confirmLabel: 'Verwijderen' })) {
          Repo.saveProduct({ ...p, discountType: 'none', salePrice: null, discountValue: null, startDate: '', endDate: '' }); draw(); Toast.show('Korting verwijderd.');
        }
      }
    });
    draw();
  },
});

Pages.adminStock = adminPage({
  key: 'voorraad', title: 'Voorraad',
  render(ctx) {
    const f = ctx.query.f || 'alle';
    return `<div class="toolbar"><div class="chips" role="group" aria-label="Filter">${[['alle', 'Alle'], ['laag', 'Lage voorraad'], ['uit', 'Uitverkocht'], ['niet', 'Niet bijgehouden']].map(([k, l]) => `<a class="chip${f === k ? ' is-active' : ''}" href="#/admin/voorraad${k === 'alle' ? '' : `?f=${k}`}"${f === k ? ' aria-current="true"' : ''}>${l}</a>`).join('')}</div>
      <span class="text-small text-muted">Lage voorraad: ≤ ${Stock.threshold()} (<a class="text-link" href="#/admin/instellingen">instelbaar</a>)</span></div>
      <section class="panel"><div class="panel-body panel-body--flush" data-stock></div></section>`;
  },
  mount(root, ctx) {
    const f = ctx.query.f || 'alle';
    const host = $('[data-stock]', root);
    const draw = () => {
      const list = Repo.products().filter((p) => !p.archived).filter((p) => {
        if (f === 'laag') return p.trackStock && p.stock <= Stock.threshold();
        if (f === 'uit') return p.trackStock && p.stock <= 0;
        if (f === 'niet') return !p.trackStock;
        return true;
      });
      host.innerHTML = list.length ? `<div class="table-wrap rtable"><table class="table admin-table"><thead><tr><th>Product</th><th>Bijhouden</th><th>Voorraad</th><th>Status</th></tr></thead><tbody>
        ${list.map((p) => `<tr><td class="cell-main" data-label="Product"><div class="prod"><div class="thumb">${Media.html(p.images[0], '', { kind: productArtKind(p) })}</div><div><a class="p-name text-link" href="#/admin/producten/${p.id}">${esc(p.name)}</a><div class="p-sub">${esc(p.sku)}</div></div></div></td>
          <td data-label="Bijhouden"><label class="switch"><input type="checkbox" data-track="${p.id}"${p.trackStock ? ' checked' : ''}><span class="track"></span><span class="sr-only">Voorraad bijhouden voor ${attr(p.name)}</span></label></td>
          <td data-label="Voorraad">${p.trackStock ? UI.qty({ id: p.id, value: Math.max(0, p.stock), max: 99999, size: 'sm', label: `Voorraad ${p.name}` }).replace('min="1"', 'min="0"') : '<span class="text-muted">—</span>'}</td>
          <td data-label="Status">${Stock.html(p)}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="panel-body">${UI.empty({ icon: 'grid', title: 'Geen producten in deze selectie' })}</div>`;
      // Stock steppers allow 0, so we handle them here instead of the generic behaviour.
      $$('[data-qty]', host).forEach((q) => {
        const input = $('input', q);
        $('[data-step="-1"]', q).disabled = Number(input.value) <= 0;
      });
    };
    const setStock = debounce((id, value) => {
      const p = Repo.product(id); if (!p) return;
      Repo.saveProduct({ ...p, stock: value }); draw(); Toast.show(`Voorraad van “${p.name}” is nu ${value}.`);
    }, 450);
    host.addEventListener('click', (e) => {
      const b = e.target.closest('[data-step]'); if (!b) return;
      const q = b.closest('[data-qty]'); const input = $('input', q);
      const v = clamp((parseInt(input.value, 10) || 0) + Number(b.dataset.step), 0, 99999);
      input.value = v; $('[data-step="-1"]', q).disabled = v <= 0;
      setStock(q.dataset.qty, v);
    });
    host.addEventListener('change', (e) => {
      if (e.target.dataset.track) { const p = Repo.product(e.target.dataset.track); Repo.saveProduct({ ...p, trackStock: e.target.checked }); draw(); Toast.show(e.target.checked ? 'Voorraad wordt bijgehouden.' : 'Voorraad wordt niet meer bijgehouden.'); return; }
      const q = e.target.closest('[data-qty]');
      if (q) { const raw = e.target.value.trim(); if (!/^\d{1,5}$/.test(raw)) { Toast.show('Vul een geldig aantal in (0 of meer).', { error: true }); draw(); return; } setStock(q.dataset.qty, parseInt(raw, 10)); }
    });
    draw();
  },
});

            ${UI.notice('<strong>Dubbele bestellingen.</strong> Elke afrekenpoging heeft een idempotency-sleutel; dubbelklikken, verversen en terugnavigeren leveren geen tweede bestelling op.', { ic: 'refresh' })}
          </div>
        </div></div></section>
      <section class="panel"><div class="panel-head"><div><h2>Gegevens</h2><p>Exporteren, importeren en demodata herstellen</p></div></div><div class="panel-body" style="display:grid;gap:16px">
        <div class="flex wrap gap-8">
          <button class="btn btn--light btn--sm" type="button" data-export>${icon('download')} Exporteer producten (JSON)</button>
          <label class="btn btn--light btn--sm" style="cursor:pointer">${icon('upload')} Importeer producten (JSON)<input type="file" accept="application/json,.json" data-import class="sr-only"></label>
          <button class="btn btn--ghost btn--sm" type="button" data-reset style="color:var(--red)">${icon('refresh')} Reset demodata</button>
        </div>
        <p class="hint">De export bevat producten en categorieën. Bij import wordt elk product gevalideerd; bestellingen blijven ongewijzigd.</p>
      </div></section>
      <section class="panel"><div class="panel-head"><div><h2>Eventlog (deze sessie)</h2><p>Analytics-ready events — er wordt niets verzonden en geen kentekens of persoonsgegevens vastgelegd.</p></div></div><div class="panel-body"><div class="event-log" data-events></div></div></section>`;
  },
  mount(root) {
    const s = Repo.settings();
    const logEl = $('[data-events]', root);
    const drawLog = () => { logEl.innerHTML = Analytics.events.length ? Analytics.events.slice().reverse().slice(0, 60).map((e) => `<div>${esc(e.at.slice(11, 19))}  ${esc(e.name)}  ${esc(JSON.stringify(e.props))}</div>`).join('') : '<div>Nog geen events in deze sessie.</div>'; };
    drawLog();
    const onEvt = () => drawLog();
    window.addEventListener('ct:analytics', onEvt);
    $('[data-ship]', root).addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target; const errEl = $('[data-ship-err]', root);
      const next = s.shipping.map((m, i) => ({ ...m, label: f[`label-${i}`].value.trim(), description: f[`desc-${i}`].value.trim(), price: Money.parse(f[`price-${i}`].value || '0'), requiresAddress: f[`addr-${i}`].checked, enabled: f[`on-${i}`].checked }));
      if (next.some((m) => !m.label)) { errEl.textContent = 'Elke methode heeft een naam nodig.'; return; }
      if (next.some((m) => !Number.isInteger(m.price) || m.price < 0)) { errEl.textContent = 'Vul geldige prijzen in (0 of meer).'; return; }
      if (!next.some((m) => m.enabled)) { errEl.textContent = 'Zet minimaal één leveringsmethode aan.'; return; }
      errEl.textContent = '';
      Repo.saveSettings({ ...Repo.settings(), shipping: next }); Toast.show('Verzending opgeslagen.');
    });
    $('[data-general]', root).addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.target; const vat = Number(f.vat.value); const low = Number(f.low.value);
      if (!Number.isInteger(vat) || vat < 0 || vat > 50) { Toast.show('Vul een geldig btw-percentage in (0–50).', { error: true }); return; }
      if (!Number.isInteger(low) || low < 0 || low > 999) { Toast.show('Vul een geldige drempel in.', { error: true }); return; }
      const cur = Repo.settings();
      Repo.saveSettings({ ...cur, vat: { ...cur.vat, rate: vat, showBreakdown: f.breakdown.checked }, lowStockThreshold: low });
      Toast.show('Instellingen opgeslagen.');
    });
    $('[data-lookup]', root).addEventListener('change', (e) => { Repo.saveSettings({ ...Repo.settings(), vehicleLookupMode: e.target.value }); Toast.show(e.target.value === 'live' ? 'Kentekens worden opgezocht via RDW Open Data.' : 'Alleen demo-kentekens worden herkend.'); });
    $('[data-export]', root).addEventListener('click', () => {
      downloadJson(`cartronic-producten-${new Date().toISOString().slice(0, 10)}.json`, { format: 'cartronic-products', version: 1, exportedAt: nowIso(), categories: Repo.shopCategories(), products: Repo.products() });
      Toast.show('Export gedownload.');
    });
    $('[data-import]', root).addEventListener('change', async (e) => {
      const file = e.target.files[0]; e.target.value = '';
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { Toast.show('Het bestand is te groot (max 8 MB).', { error: true }); return; }
      let data;
      try { data = JSON.parse(await file.text()); } catch (er) { Toast.show('Dit is geen geldig JSON-bestand.', { error: true }); return; }
      if (!data || data.format !== 'cartronic-products' || !Array.isArray(data.products) || !Array.isArray(data.categories)) { Toast.show('Onbekend formaat. Gebruik een export uit dit beheer.', { error: true }); return; }
      const cats = data.categories.filter((c) => c && typeof c.id === 'string' && typeof c.name === 'string').map((c, i) => ({ id: c.id, name: c.name.slice(0, 60), slug: slugify(c.slug || c.name), order: i + 1 }));
      const prevCats = Repo.shopCategories();
      Repo.saveShopCategories(cats); // temporary, to validate category references
      const problems = [];
      const products = data.products.map((p) => ({ ...blankProduct(), ...p, compatibility: { brands: [], models: [], note: '', ...(p.compatibility || {}) }, images: Array.isArray(p.images) ? p.images : [] }));
      products.forEach((p, i) => { const er = validateProduct(p, products); if (Object.keys(er).length) problems.push(`${p.name || `Product ${i + 1}`}: ${Object.values(er)[0]}`); });
      Repo.saveShopCategories(prevCats);
      if (problems.length) {
        Overlay.open({ title: 'Import afgebroken', size: 'sm', body: `<p class="text-small" style="margin-bottom:12px">${problems.length} product(en) zijn ongeldig. Er is niets gewijzigd.</p><ul class="text-small" style="padding-left:18px;display:grid;gap:6px">${problems.slice(0, 8).map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`, foot: '<button class="btn btn--dark btn--sm" type="button" data-close>Sluiten</button>' });
        return;
      }
      if (await Overlay.confirm({ title: 'Producten importeren?', message: `${products.length} producten en ${cats.length} categorieën vervangen de huidige catalogus. Bestellingen blijven ongewijzigd.`, confirmLabel: 'Importeren' })) {
        Repo.saveShopCategories(cats); Repo.replaceProducts(products); Toast.show('Import voltooid.');
      }
    });
    $('[data-reset]', root).addEventListener('click', async () => {
      if (await Overlay.confirm({ title: 'Demodata herstellen?', message: 'Producten, categorieën, bestellingen, projecten en instellingen worden teruggezet naar de oorspronkelijke demodata. Dit kan niet ongedaan worden gemaakt.', confirmLabel: 'Reset demodata', danger: true })) {
        Repo.reset(); Cart.clear(); Toast.show('Demodata hersteld.'); Router.render();
      }
    });
    return () => window.removeEventListener('ct:analytics', onEvt);
  },
});

/* =====================================================================
   MOTION — GSAP + ScrollTrigger
   Restrained, transform/opacity only. Disabled for prefers-reduced-motion and
   whenever the library cannot be loaded; content is always visible without it.
   ===================================================================== */
const Motion = {
  g: null,
  ctx: null,
  bootAt: (typeof performance !== 'undefined' ? performance.now() : 0),
  async init() {
    if (reducedMotion()) { document.documentElement.classList.add('no-motion'); return; }
    try { await window.__ctMotionReady; } catch (e) { document.documentElement.classList.add('no-motion'); return; }
    if (!window.gsap || !window.ScrollTrigger) { document.documentElement.classList.add('no-motion'); return; }
    window.gsap.registerPlugin(window.ScrollTrigger);
    window.gsap.defaults({ ease: 'power3.out', duration: 0.8 });
    this.g = window.gsap;
    // If the library arrives after the first paint, never hide content that is already visible.
    const late = performance.now() - this.bootAt > 700;
    this.page($('#app'), { late });
  },
  get on() { return !!this.g && !reducedMotion(); },
  cleanup() { if (this.ctx) { this.ctx.revert(); this.ctx = null; } },
  inView(el) { const r = el.getBoundingClientRect(); return r.top < window.innerHeight && r.bottom > 0; },
  page(root, { late = false } = {}) {
    if (!this.on || !root) return;
    this.cleanup();
    const g = this.g; const ST = window.ScrollTrigger;
    const skip = (el) => late && this.inView(el);
    this.ctx = g.context(() => {
      const hero = root.querySelector('[data-hero]');
      if (hero) {
        const img = hero.querySelector('.hero-media img');
        if (!late) {
          const tl = g.timeline();
          if (img) tl.from(img, { scale: 1.06, opacity: 0, duration: 1.6, ease: 'power2.out' }, 0);
          tl.from(hero.querySelectorAll('[data-hero-line]'), { yPercent: 35, opacity: 0, duration: 1, stagger: 0.12 }, 0.12)
            .from(hero.querySelectorAll('[data-hero-item]'), { y: 14, opacity: 0, duration: 0.8, stagger: 0.07 }, 0.32);
        }
        if (img) g.to(img, { yPercent: 5, ease: 'none', scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom top', scrub: true } });
      }
      root.querySelectorAll('.page-header h1').forEach((h) => { if (!skip(h)) g.from(h, { y: 16, opacity: 0, duration: 0.8, delay: 0.05 }); });
      root.querySelectorAll('[data-split], [data-reveal]').forEach((el) => {
        if (skip(el) || el.closest('.page-header')) return;
        g.from(el, { y: el.hasAttribute('data-split') ? 26 : 18, opacity: 0, duration: 0.85, scrollTrigger: { trigger: el, start: 'top 90%', once: true } });
      });
      root.querySelectorAll('[data-stagger]').forEach((grp) => {
        const kids = Array.from(grp.children).filter((k) => !k.hidden);
        if (!kids.length || skip(grp)) return;
        g.from(kids, { y: 24, opacity: 0, duration: 0.7, stagger: 0.07, scrollTrigger: { trigger: grp, start: 'top 90%', once: true } });
      });
      root.querySelectorAll('[data-mask]').forEach((el) => {
        if (skip(el)) return;
        g.from(el, { clipPath: 'inset(0% 0% 100% 0%)', duration: 1.1, ease: 'power3.inOut', scrollTrigger: { trigger: el, start: 'top 88%', once: true } });
        const img = el.querySelector('img');
        if (img) g.from(img, { scale: 1.1, duration: 1.5, ease: 'power2.out', scrollTrigger: { trigger: el, start: 'top 88%', once: true } });
      });
      root.querySelectorAll('.eyebrow--line').forEach((el) => { if (!skip(el) && !el.closest('[data-hero]')) g.from(el, { opacity: 0, x: -10, duration: 0.6, scrollTrigger: { trigger: el, start: 'top 92%', once: true } }); });
      const seq = root.querySelector('[data-sequence]');
      if (seq) {
        const bar = seq.querySelector('.steps-progress');
        if (bar) g.fromTo(bar, { scaleY: 0 }, { scaleY: 1, ease: 'none', scrollTrigger: { trigger: seq, start: 'top 72%', end: 'bottom 62%', scrub: 0.4 } });
        seq.querySelectorAll('.step').forEach((step) => {
          ST.create({ trigger: step, start: 'top 74%', onEnter: () => step.classList.add('is-active'), onLeaveBack: () => step.classList.remove('is-active') });
          if (!skip(step)) g.from(step.querySelectorAll('h3, p, .step-tag'), { y: 14, opacity: 0, duration: 0.7, stagger: 0.06, scrollTrigger: { trigger: step, start: 'top 86%', once: true } });
        });
      }
    }, root);
    requestAnimationFrame(() => ST.refresh());
  },
  /** Short entrance for re-rendered lists (filters). */
  swap(container, selector) {
    if (!container) return;
    this.enter(Array.from(selector ? container.querySelectorAll(selector) : container.children));
  },
  enter(els) {
    if (!this.on || !els || !els.length) return;
    this.g.fromTo(els, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.38, stagger: 0.035, ease: 'power2.out', overwrite: true, clearProps: 'transform,opacity' });
    window.ScrollTrigger.refresh();
  },
  vehicleFound(el) {
    if (!el || !this.on) return;
    this.g.fromTo(el, { opacity: 0, y: 10, scale: 0.985 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'power3.out', clearProps: 'transform,opacity' });
  },
};

function registerRoutes() {
  Router.add('/', Pages.home);
  Router.add('/mogelijkheden', Pages.catalog);
  Router.add('/mogelijkheden/:slug', Pages.retrofit);
  Router.add('/merken', Pages.brands);
  Router.add('/merken/:brand', Pages.brand);
  Router.add('/projecten', Pages.projects);
  Router.add('/projecten/:slug', Pages.project);
  Router.add('/expertise', Pages.expertise);
  Router.add('/diensten/:slug', Pages.service);
  Router.add('/over', Pages.about);
  Router.add('/contact', Pages.contact);
  Router.add('/mijn-auto', Pages.garage);
  Router.add('/zoeken', Pages.search);
  Router.add('/webshop', Pages.shop);
  Router.add('/webshop/:slug', Pages.product);
  Router.add('/winkelmand', Pages.cart);
  Router.add('/afrekenen', Pages.checkout);
  Router.add('/betaling/:id', Pages.payment);
  Router.add('/bestelling/:id', Pages.orderResult);
  Router.add('/admin', Pages.adminDashboard);
  Router.add('/admin/producten', Pages.adminProducts);
  Router.add('/admin/producten/nieuw', Pages.adminProductForm);
  Router.add('/admin/producten/:id', Pages.adminProductForm);
  Router.add('/admin/categorieen', Pages.adminCategories);
  Router.add('/admin/bestellingen', Pages.adminOrders);
  Router.add('/admin/bestellingen/:id', Pages.adminOrder);
  Router.add('/admin/acties', Pages.adminPromos);
  Router.add('/admin/voorraad', Pages.adminStock);
  Router.add('/admin/projecten', Pages.adminProjects);
  Router.add('/admin/projecten/nieuw', Pages.adminProjectForm);
  Router.add('/admin/projecten/:id', Pages.adminProjectForm);
  Router.add('/admin/instellingen', Pages.adminSettings);
  Router.add('*', Pages.notFound);
  // Archived catalog URLs (e.g. cartronic.nl slugs) → the current page for the same option.
  Router.redirect((path) => {
    const m = path.match(/^\/mogelijkheden\/([^/]+)$/);
    return m && !RETROFIT[m[1]] && RETROFIT_ALIAS[m[1]] ? `/mogelijkheden/${RETROFIT_ALIAS[m[1]]}` : null;
  });
}

function bindGlobal() {
  document.addEventListener('click', async (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const act = el.dataset.action;
    switch (act) {
      case 'open-search': e.preventDefault(); Layout.closeMenu(); SearchOverlay.open(); break;
      case 'open-vehicle': e.preventDefault(); Layout.closeMenu(); VehicleModal.open(); break;
      case 'open-cart': e.preventDefault(); Layout.closeMenu(); CartUI.openDrawer(); break;
      case 'toggle-menu': e.preventDefault(); Layout.toggleMenu(); break;
      case 'whatsapp': Analytics.track('whatsapp_clicked', { context: Router.current ? Router.current.path : '' }); break;
      case 'scroll-to': {
        const t = document.getElementById(el.dataset.target);
        if (!t) break;
        e.preventDefault();
        t.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
        const inp = t.querySelector('[data-panel]:not([hidden]) input, [data-panel]:not([hidden]) select');
        setTimeout(() => inp && inp.focus({ preventScroll: true }), reducedMotion() ? 0 : 550);
        break;
      }
      case 'add-to-cart': {
        e.preventDefault();
        const id = el.dataset.id;
        let qty = 1;
        if (el.dataset.qtyFrom) { const inp = $(el.dataset.qtyFrom); qty = parseInt(inp && inp.value, 10) || 1; }
        const res = Cart.add(id, qty);
        if (!res.ok) { Toast.show(res.message, { error: true }); break; }
        CartUI.showAdded(Repo.product(id), res);
        announce(`${Repo.product(id).name} toegevoegd aan winkelmand`);
        if (Router.current && Router.current.path.startsWith('/webshop/')) Router.render();
        break;
      }
      case 'toggle-save': {
        e.preventDefault();
        const on = Saved.toggle(el.dataset.type, el.dataset.id);
        $$(`[data-action="toggle-save"][data-type="${el.dataset.type}"][data-id="${CSS.escape(el.dataset.id)}"]`).forEach((b) => {
          b.setAttribute('aria-pressed', String(on));
          const lbl = $('[data-save-label]', b); if (lbl) lbl.textContent = on ? 'Bewaard' : (el.dataset.type === 'products' ? 'Bewaar' : 'Bewaar optie');
          if (b.classList.contains('save-btn')) { const name = (b.getAttribute('aria-label') || '').split(': ').slice(1).join(': '); b.setAttribute('aria-label', `${on ? 'Verwijder uit bewaard' : 'Bewaar'}: ${name}`); b.title = on ? 'Bewaard' : 'Bewaar'; }
          b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
        });
        Toast.show(on ? 'Bewaard. U vindt het terug onder Mijn auto.' : 'Verwijderd uit bewaard.', on ? { action: { label: 'Bekijk', href: '#/mijn-auto?section=bewaard' } } : {});
        break;
      }
      case 'clear-recent': Recent.clear(); Toast.show('Geschiedenis gewist.'); Router.render(); break;
      case 'forget-plate': VehicleStore.forgetPlate(); Toast.show('Uw kenteken is vergeten.'); Router.render(); break;
      case 'wipe-local': {
        const ok = await Overlay.confirm({ title: 'Alles wissen?', message: 'Uw auto, kenteken, bewaarde opties en producten, geschiedenis, winkelmand en concepten worden uit deze browser verwijderd.', confirmLabel: 'Alles wissen', danger: true });
        if (!ok) break;
        VehicleStore.clear(); Storage.remove('saved'); Recent.clear(); Cart.clear();
        Storage.remove('contactDraft', 'session'); Storage.remove('checkoutForm', 'session'); Storage.remove('checkoutKey', 'session');
        Bus.emit('saved:changed'); Toast.show('Uw gegevens zijn uit deze browser verwijderd.'); Router.render();
        break;
      }
      case 'adopt-vehicle': {
        const v = VehicleStore.set({ brandId: el.dataset.brand, modelId: el.dataset.model, source: 'manual', confidence: 'manual' });
        Toast.show(`Uw auto is ingesteld: ${VehicleStore.name(v)}`);
        Router.go('/mogelijkheden');
        break;
      }
      default: break;
    }
  });
  document.addEventListener('keydown', (e) => {
    const typing = e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
    if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !typing)) {
      if (Overlay.count || document.body.classList.contains('is-admin')) return;
      e.preventDefault(); SearchOverlay.open();
    }
    if (e.key === 'Escape' && $('#mobileNav')?.classList.contains('is-open')) Layout.toggleMenu(false);
  });
  ['cart:changed', 'vehicle:changed', 'saved:changed', 'data:changed', 'products:changed'].forEach((evt) => Bus.on(evt, () => Layout.refreshDynamic()));
  let lastErr = 0;
  const friendly = () => { if (Date.now() - lastErr < 5000) return; lastErr = Date.now(); Toast.show('Er ging iets mis. Probeer het opnieuw of ververs de pagina.', { error: true }); };
  window.addEventListener('unhandledrejection', (e) => { console.error(e.reason); friendly(); });
  window.addEventListener('error', (e) => { if (e.target && e.target !== window) return; console.error(e.error || e.message); friendly(); });
}

function init() {
  Repo.init();
  Media.installFallback();
  Layout.renderHeader();
  Layout.renderFooter();
  registerRoutes();
  bindGlobal();
  Router.start();
  Motion.init();
  // Debug/QA handle (no secrets live in this prototype).
  window.CT = { Repo, Cart, Router, VehicleStore, VehicleLookup, VehicleMatcher, Plate, Pricing, Money, Analytics, Search, Payments, OrderService, CheckoutService, Compat,
    catalog: { RETROFITS, RETROFIT_ALIAS, MODELS, FEATURES, CATEGORIES, ART: Object.keys(ART_SHAPES) } };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

})();

<script>
