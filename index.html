   ========================================================= */
body.is-admin { background: var(--bg-soft); }
body.is-admin .site-header, body.is-admin .site-footer, body.is-admin .mobile-bar { display: none !important; }
body.is-admin { padding-bottom: 0 !important; }

.admin { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.admin-side {
  position: sticky; top: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
  background: var(--dark-1); color: var(--dark-text); padding: 22px 14px 18px; overflow-y: auto;
}
.admin-side .as-brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 10px 22px; border-bottom: 1px solid var(--dark-line); }
.admin-side .as-brand svg { height: 26px; width: auto; }
.admin-side .as-brand .lbl { font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--dark-muted); }
.admin-nav { list-style: none; display: grid; gap: 2px; margin-top: 18px; }
.admin-nav a {
  display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: var(--radius);
  font-size: 14px; font-weight: 500; color: var(--dark-text); transition: background-color var(--t-fast), color var(--t-fast);
}
.admin-nav a svg { width: 18px; height: 18px; color: var(--dark-muted); flex: none; }
.admin-nav a:hover { background: rgba(255, 255, 255, .05); color: #fff; }
.admin-nav a[aria-current="page"] { background: rgba(255, 255, 255, .08); color: #fff; box-shadow: inset 2px 0 0 var(--red); }
.admin-nav a[aria-current="page"] svg { color: var(--red-soft); }
.admin-nav .an-count { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--red); color: #fff; border-radius: 9px; min-width: 20px; height: 18px; display: grid; place-items: center; padding: 0 6px; }
.admin-side .as-foot { margin-top: auto; padding: 16px 10px 0; border-top: 1px solid var(--dark-line); font-size: 12px; line-height: 1.6; color: var(--dark-muted); }
.admin-side .as-foot a { color: #fff; text-decoration: underline; text-underline-offset: 3px; }

.admin-main { min-width: 0; display: flex; flex-direction: column; }
.admin-top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 10px 32px;
  background: rgba(255, 255, 255, .96); border-bottom: 1px solid var(--line);
}
.admin-top h1 { font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
.admin-top .at-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.admin-top .admin-menu-btn { display: none; }
.admin-content { padding: 32px; max-width: 1360px; width: 100%; }
.admin-content > * + * { margin-top: 24px; }

.panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-head h2 { font-size: 15px; font-weight: 650; letter-spacing: -.015em; }
.panel-head p { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.panel-body { padding: 20px; }
.panel-body--flush { padding: 0; }
.panel .table-wrap { border: 0; border-radius: 0; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.kpi { position: relative; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 16px; transition: border-color var(--t-fast); }
.kpi:hover { border-color: var(--line-strong); }
.kpi .k-label { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi .k-value { font-size: 30px; font-weight: 700; letter-spacing: -.03em; margin-top: 8px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi .k-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.kpi a.stretch::after { content: ""; position: absolute; inset: 0; }
.kpi--alert .k-value { color: var(--warn); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.dash-grid > * + * { margin-top: 0 !important; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.toolbar .grow { flex: 1; min-width: 200px; }
.toolbar .input-icon { min-width: 220px; flex: 1; max-width: 360px; }

.admin-table td .prod { display: flex; gap: 12px; align-items: center; min-width: 220px; }
.admin-table td .prod .thumb { width: 52px; height: 40px; border-radius: 2px; overflow: hidden; background: var(--bg-soft); flex: none; border: 1px solid var(--line); }
.admin-table td .prod .thumb img, .admin-table td .prod .thumb .art { width: 100%; height: 100%; object-fit: cover; }
.admin-table td .prod .p-name { font-weight: 600; line-height: 1.35; letter-spacing: -.01em; }
.admin-table td .prod .p-sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.admin-table .row-actions { display: flex; gap: 4px; justify-content: flex-end; align-items: center; }
.admin-table .row-actions .icon-btn[disabled] { opacity: .35; cursor: not-allowed; }
.admin-table .row-actions .icon-btn:hover:not([disabled]) { background: var(--bg-soft-2); }
.admin-table tr.is-archived td { color: var(--muted); }
.admin-table tr.is-archived .prod .thumb { opacity: .5; }
.admin-table tr.qe-row td { background: #FAFBFC; padding: 0; }
.admin-table tr.qe-row:hover { background: transparent; }
.admin-table .clickable { cursor: pointer; }

.quick-edit { padding: 18px 20px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: end; border-top: 1px dashed var(--line-strong); }
.quick-edit .qe-actions { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.quick-edit .qe-switches { display: flex; gap: 22px; flex-wrap: wrap; }

.form-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.form-layout > * + * { margin-top: 0 !important; }
.form-col { display: grid; gap: 24px; }
.panel .form-grid { gap: 18px; }
.save-bar {
  position: sticky; bottom: 0; z-index: 15; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  margin: 24px -32px -32px; padding: 14px 32px calc(14px + var(--safe-bottom)); background: rgba(255, 255, 255, .97); border-top: 1px solid var(--line);
}
.save-bar .sb-status { font-size: 13px; color: var(--muted); }
.save-bar .sb-status.is-dirty { color: var(--warn); font-weight: 600; }
.save-bar .sb-actions { display: flex; gap: 10px; margin-left: auto; }
.price-preview { padding: 16px; background: var(--bg-soft); border-radius: var(--radius); border: 1px solid var(--line); }
.price-preview .pp-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.radio-row { display: flex; flex-wrap: wrap; gap: 8px; }
.radio-tile { position: relative; }
.radio-tile input { position: absolute; opacity: 0; }
.radio-tile span { display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; transition: all var(--t-fast); }
.radio-tile input:checked + span { background: var(--ink); color: #fff; border-color: var(--ink); }
.radio-tile input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.image-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
.image-item { position: relative; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #fff; }
.image-item .ii-media { aspect-ratio: 4 / 3; background: var(--bg-soft); }
.image-item .ii-media img, .image-item .ii-media .art { width: 100%; height: 100%; object-fit: cover; }
.image-item .ii-actions { display: flex; justify-content: space-between; align-items: center; padding: 6px; gap: 4px; }
.image-item .ii-primary { position: absolute; top: 6px; left: 6px; }
.model-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px 16px; max-height: 260px; overflow-y: auto; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #FCFCFD; }
.model-checks .mc-brand { grid-column: 1 / -1; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding-top: 6px; }
.model-checks .mc-brand:first-child { padding-top: 0; }
.error-summary { border: 1px solid #F2CDD1; background: var(--danger-bg); color: var(--danger); border-radius: var(--radius); padding: 14px 16px; font-size: 13.5px; }
.error-summary ul { margin-top: 6px; padding-left: 18px; }
.error-summary a { text-decoration: underline; }

.timeline { list-style: none; display: grid; gap: 0; }
.timeline li { position: relative; padding: 0 0 18px 22px; font-size: 13.5px; }
.timeline li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); }
.timeline li::after { content: ""; position: absolute; left: 7px; top: 16px; bottom: 0; width: 1px; background: var(--line-strong); }
.timeline li:last-child::after { display: none; }
.timeline .tl-time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 20px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; word-break: break-word; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; background: var(--bg-soft); padding: 2px 6px; border-radius: 2px; }
.flow { list-style: none; counter-reset: flow; display: grid; gap: 8px; font-size: 13px; }
.flow li { counter-increment: flow; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; color: var(--ink-2); }
.flow li::before { content: counter(flow); width: 22px; height: 22px; border-radius: 50%; background: var(--bg-soft-2); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink); }
.login-wrap { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--dark-1); }
.login-card { width: min(420px, 100%); background: #fff; border-radius: var(--radius-lg); padding: 36px 32px 30px; box-shadow: var(--shadow-pop); }
.login-card .lc-logo svg { height: 30px; width: auto; }
.login-card h1 { font-size: 22px; letter-spacing: -.025em; margin-top: 26px; }
.login-card form { margin-top: 22px; display: grid; gap: 16px; }
.event-log { max-height: 240px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--dark-1); color: #CDE3D5; padding: 14px; border-radius: var(--radius); }
.event-log div + div { margin-top: 4px; }

@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1100px) {
  .dash-grid, .form-layout { grid-template-columns: minmax(0, 1fr); }
  .quick-edit { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .admin { grid-template-columns: minmax(0, 1fr); }
  .admin-side { position: fixed; z-index: 120; left: 0; top: 0; width: 272px; transform: translateX(-100%); transition: transform .32s var(--ease-out); box-shadow: var(--shadow-pop); }
  .admin.side-open .admin-side { transform: none; }
  .admin-scrim { position: fixed; inset: 0; z-index: 110; background: rgba(11, 13, 17, .5); opacity: 0; pointer-events: none; transition: opacity var(--t); }
  .admin.side-open .admin-scrim { opacity: 1; pointer-events: auto; }
  .admin-top { padding: 10px 16px; }
  .admin-top .admin-menu-btn { display: inline-grid; }
  .admin-top .at-right .hide-sm { display: none; }
  .admin-content { padding: 20px 16px 32px; }
  .save-bar { margin: 24px -16px -32px; padding-inline: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi .k-value { font-size: 26px; }
  /* Tables become cards */
  .rtable table, .rtable tbody, .rtable tr, .rtable td { display: block; width: 100%; }
  .rtable thead { display: none; }
  .rtable tbody tr:not(.qe-row) { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
  .rtable td { padding: 0; border: 0; }
  .rtable td[data-label]::before { content: attr(data-label); display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .rtable td.cell-main { grid-column: 1 / -1; }
  .rtable td.num { text-align: left; }
  .rtable td.cell-actions { grid-column: 1 / -1; }
  .rtable .row-actions { justify-content: flex-start; flex-wrap: wrap; }
  .quick-edit { grid-template-columns: minmax(0, 1fr); padding: 16px; }
}
@media (min-width: 901px) { .admin-scrim { display: none; } }
@media (max-width: 480px) { .kpis { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

   Adapters ....... isolated so they can be replaced without touching the UI:

const fmtDateTime = (iso) => { try { return DATETIME_FMT.format(new Date(iso)); } catch (e) { return ''; } };

/* ---------- Money: integer cents only ---------- */
const EUR = new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR' });
const Money = {
  fmt(cents) { return EUR.format((Number(cents) || 0) / 100); },
  /** Parses user input ("249", "249,95", "1.249,95", "249.95") into integer cents, or NaN. */
  parse(input) {
    let s = String(input == null ? '' : input).trim().replace(/[€\s]/g, '');
    if (!s) return NaN;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    if (!/^\d{1,7}(\.\d{1,2})?$/.test(s)) return NaN;
    const [i, d = ''] = s.split('.');
    return parseInt(i, 10) * 100 + parseInt((d + '00').slice(0, 2), 10);
  },
  toInput(cents) { return Number.isFinite(cents) ? (cents / 100).toFixed(2).replace('.', ',') : ''; },
  /** Percentage of `part` relative to `whole`, rounded to a whole percent. */
  pct(part, whole) { return whole > 0 ? Math.round((part / whole) * 100) : 0; },

const Storage = (() => {
  const PREFIX = 'ct.v1.';
  const memory = { local: {}, session: {} };
  function probe(name) {
    try { const s = window[name]; s.setItem('__ct', '1'); s.removeItem('__ct'); return s; } catch (e) { return null; }
  }
  const areas = { local: probe('localStorage'), session: probe('sessionStorage') };
  function get(key, fallback, area = 'local') {
    try {
      const s = areas[area];
      const raw = s ? s.getItem(PREFIX + key) : memory[area][key];
      return raw == null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  }
  function set(key, value, area = 'local') {
    const raw = JSON.stringify(value);
    try {
      const s = areas[area];
      if (s) s.setItem(PREFIX + key, raw); else memory[area][key] = raw;
      return true;
    } catch (e) {
      memory[area][key] = raw;
      if (typeof Toast !== 'undefined') Toast.show('De opslag van deze browser is vol. Wijzigingen blijven bewaard tot u de pagina sluit.', { error: true });

  }
  function remove(key, area = 'local') {
    try { const s = areas[area]; if (s) s.removeItem(PREFIX + key); delete memory[area][key]; } catch (e) { /* ignore */ }
  }
  return { get, set, remove, PREFIX, available: !!areas.local };
})();

  const handlers = {};
  return {
    on(evt, fn) { (handlers[evt] = handlers[evt] || []).push(fn); return () => this.off(evt, fn); },
    off(evt, fn) { handlers[evt] = (handlers[evt] || []).filter((h) => h !== fn); },
    emit(evt, data) { (handlers[evt] || []).slice().forEach((h) => { try { h(data); } catch (e) { console.error(e); } }); },
  };
})();

    const clean = {};

/* ---------- Toasts ---------- */
const Toast = {
  show(message, { action, error = false, duration = 4800 } = {}) {
    const region = $('#toastRegion'); if (!region) return;
    const el = document.createElement('div');
    el.className = `toast${error ? ' is-error' : ''}`;
    el.setAttribute('role', error ? 'alert' : 'status');
    el.innerHTML = `${icon(error ? 'alertCircle' : 'check', 't-icon')}<div>${esc(message)}</div>
      <div class="flex items-center gap-8">${action ? `<a class="t-action" href="${attr(action.href)}">${esc(action.label)}</a>` : ''}
      <button class="t-close" type="button" aria-label="Melding sluiten">${icon('x')}</button></div>`;
    region.appendChild(el);
    requestAnimationFrame(() => el.classList.add('is-in'));
    const close = () => { el.classList.remove('is-in'); setTimeout(() => el.remove(), 320); };
    el.querySelector('.t-close').addEventListener('click', close);
    el.querySelector('.t-action')?.addEventListener('click', close);
    if (duration) setTimeout(close, duration);
    while (region.children.length > 3) region.firstElementChild.remove();
  },
};

/* ---------- Overlays: modal, drawer, confirm (with focus management) ---------- */
const Overlay = (() => {
  const stack = [];
  const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  function lockScroll() { document.body.classList.add('is-locked'); }
  function unlockScroll() { if (!stack.length) document.body.classList.remove('is-locked'); }

  function open({ kind = 'modal', title = '', body = '', foot = '', size = '', className = '', onMount, onClose, labelledBy, side = 'right', initialFocus } = {}) {
    const root = $('#overlayRoot');
    const id = uid('ov');
    const backdrop = document.createElement('div');
    backdrop.className = 'overlay-backdrop';
    const panel = document.createElement('div');
    const titleId = `${id}_title`;
    panel.setAttribute('role', 'dialog');
    panel.setAttribute('aria-modal', 'true');
    panel.setAttribute('aria-labelledby', labelledBy || titleId);
    panel.tabIndex = -1;
    if (kind === 'drawer') {
      panel.className = `drawer${side === 'left' ? ' drawer--left' : ''} ${className}`;
      panel.innerHTML = `<div class="drawer-head"><h2 id="${titleId}">${title}</h2><button class="icon-btn" type="button" data-close aria-label="Sluiten">${icon('x')}</button></div>
        <div class="drawer-body">${body}</div>${foot ? `<div class="drawer-foot">${foot}</div>` : ''}`;
    } else if (kind === 'raw') {
      panel.className = className;
      panel.innerHTML = body;
    } else {
      panel.className = `modal ${size ? `modal--${size}` : ''} ${className}`;
      panel.innerHTML = `<div class="modal-head"><h2 id="${titleId}">${title}</h2><button class="icon-btn" type="button" data-close aria-label="Sluiten">${icon('x')}</button></div>
        <div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}`;
    }
    root.appendChild(backdrop);
    root.appendChild(panel);
    const entry = { id, panel, backdrop, onClose, returnFocus: document.activeElement, closed: false };
    stack.push(entry);
    lockScroll();
    requestAnimationFrame(() => { backdrop.classList.add('is-open'); panel.classList.add('is-open'); });

    const close = (result) => closeEntry(entry, result);
    entry.close = close;
    backdrop.addEventListener('click', () => close());
    panel.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) { e.preventDefault(); close(); } });
    panel.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); return; }
      if (e.key !== 'Tab') return;
      const f = $$(FOCUSABLE, panel).filter((el) => el.offsetParent !== null || el === document.activeElement);
      if (!f.length) { e.preventDefault(); return; }
      const first = f[0]; const last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });
    if (onMount) onMount(panel, close);
    const focusFirst = () => {
      if (entry.closed || panel.contains(document.activeElement)) return;
      const target = initialFocus ? $(initialFocus, panel) : ($('[autofocus]', panel) || $$(FOCUSABLE, panel).find((el) => !el.hasAttribute('data-close')) || panel);
      try { target.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    };
    focusFirst(); // synchronous, so keystrokes typed right after opening are not lost
    setTimeout(focusFirst, 60);
    return { panel, close };
  }

  function closeEntry(entry, result) {
    if (entry.closed) return;
    entry.closed = true;
    const idx = stack.indexOf(entry);
    if (idx > -1) stack.splice(idx, 1);
    entry.backdrop.classList.remove('is-open');
    entry.panel.classList.remove('is-open');
    setTimeout(() => { entry.backdrop.remove(); entry.panel.remove(); }, 380);
    unlockScroll();
    try { entry.returnFocus && entry.returnFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    if (entry.onClose) entry.onClose(result);
  }

  function closeAll() { stack.slice().forEach((e) => closeEntry(e)); }

  /** Promise-based confirmation dialog. */
  function confirm({ title = 'Weet u het zeker?', message = '', confirmLabel = 'Bevestigen', cancelLabel = 'Annuleren', danger = false } = {}) {
    return new Promise((resolve) => {
      let answered = false;
      open({
        size: 'sm', title: esc(title),
        body: `<p class="text-muted" style="font-size:14.5px;line-height:1.65">${message}</p>`,
        foot: `<button class="btn btn--light btn--sm" type="button" data-cancel>${esc(cancelLabel)}</button>
               <button class="btn ${danger ? 'btn--primary' : 'btn--dark'} btn--sm" type="button" data-ok>${esc(confirmLabel)}</button>`,
        initialFocus: '[data-cancel]',
        onMount(panel, close) {
          panel.querySelector('[data-ok]').addEventListener('click', () => { answered = true; close(true); });
          panel.querySelector('[data-cancel]').addEventListener('click', () => close(false));
        },
        onClose() { resolve(answered); },
      });
    });
  }

  return { open, closeAll, confirm, get count() { return stack.length; } };
})();

/* ---------- Router (hash based, simulates production URL structure) ---------- */
const Router = (() => {
  const routes = [];
  let current = null;
  let cleanup = null;
  let guard = null;
  let lastHash = location.hash;
  const redirects = [];

  function add(pattern, page) {
    const keys = [];
    const re = pattern === '*' ? /(?!)/ : new RegExp('^' + pattern.replace(/\//g, '\\/').replace(/:(\w+)/g, (_, k) => { keys.push(k); return '([^/]+)'; }) + '\\/?$');
    routes.push({ pattern, re, keys, page });
  }
  function parse(hash = location.hash) {
    const h = decodeURI(hash.replace(/^#/, '')) || '/';
    const [rawPath, qs = ''] = h.split('?');
    const path = ('/' + rawPath.replace(/^\/+/, '')).replace(/\/+$/, '') || '/';
    const query = {};
    new URLSearchParams(qs).forEach((v, k) => { query[k] = v; });
    return { path, query };
  }
  function match(path) {
    for (const r of routes) {
      const m = path.match(r.re);
      if (m) {
        const params = {};
        r.keys.forEach((k, i) => { params[k] = decodeURIComponent(m[i + 1]); });
        return { route: r, params };
      }
    }
    return null;
  }
  function buildHash(path, query = {}) {
    const qs = new URLSearchParams(Object.entries(query).filter(([, v]) => v !== '' && v != null)).toString();
    return `#${path}${qs ? `?${qs}` : ''}`;
  }
  function go(path, query) {
    const hash = typeof query === 'object' ? buildHash(path, query) : (path.startsWith('#') ? path : `#${path}`);
    if (hash === location.hash) { render({ force: true }); return; }
    location.hash = hash;
  }
  /** Updates the query string without re-rendering the page (filters, shareable state). */
  function setQuery(query, { replace = true } = {}) {
    const { path } = parse();
    const hash = buildHash(path, query);
    if (hash === location.hash) return;
    if (replace) history.replaceState(null, '', hash); else history.pushState(null, '', hash);
    lastHash = location.hash;
  }
  async function onHashChange() {
    if (location.hash === lastHash) return; // popstate + hashchange can both fire for one navigation
    if (guard) {
      const msg = guard();
      if (msg) {
        const target = location.hash;
        history.replaceState(null, '', lastHash); // revert the URL while asking (does not fire hashchange)
        const ok = await Overlay.confirm({ title: 'Wijzigingen niet opgeslagen', message: esc(msg), confirmLabel: 'Pagina verlaten', cancelLabel: 'Blijven', danger: true });
        if (!ok) return;
        guard = null;
        history.pushState(null, '', target);
      }
    }
    lastHash = location.hash;
    render();
  }
  /** fn(path) → new path or null. Old URLs are replaced in history, so Back skips them. */
  function redirect(fn) { redirects.push(fn); }
  async function render({ force = false } = {}) {
    const { path, query } = parse();
    for (const fn of redirects) {
      const to = fn(path);
      if (to && to !== path) { history.replaceState(null, '', buildHash(to, query)); lastHash = location.hash; return render({ force }); }
    }
    const m = match(path) || { route: routes.find((r) => r.pattern === '*'), params: {} };
    const page = m.route.page;
    const ctx = { path, query, params: m.params, hash: location.hash };
    RouteProgress.start();
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
    guard = null;
    Overlay.closeAll();
    Motion.cleanup();
    // Fresh root per render: listeners that pages attach in mount() never accumulate across navigations.
    const oldApp = $('#app');
    const app = oldApp.cloneNode(false);
    oldApp.replaceWith(app);
    let html = '';
    try {
      html = page.render(ctx);
    } catch (e) {
      console.error(e);
      html = Pages.error.render(ctx);
    }
    document.body.className = document.body.className.split(' ').filter((c) => !c.startsWith('page-') && c !== 'is-admin' && c !== 'has-mobile-bar').join(' ');
    document.body.classList.add(`page-${page.id || 'x'}`);
    if (page.admin) document.body.classList.add('is-admin');
    if (page.mobileBar !== false && !page.admin) document.body.classList.add('has-mobile-bar');
    app.innerHTML = html;
    const meta = typeof page.meta === 'function' ? page.meta(ctx) : (page.meta || {});
    Seo.apply(meta, ctx);
    Layout.update(ctx, page);
    const prevPath = current ? current.path : null;
    current = ctx;
    if (prevPath !== path) { const mc = document.getElementById('miniCart'); if (mc) mc.classList.remove('is-open'); }
    if (!ctx.query.section && (prevPath !== path || force)) window.scrollTo(0, 0);
    try { cleanup = page.mount ? page.mount(app, ctx) || null : null; } catch (e) { console.error(e); }
    if (ctx.query.section) {
      const target = document.getElementById(ctx.query.section);
      if (target) setTimeout(() => target.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' }), 60);
    }
    if (prevPath !== null && prevPath !== path) {
      const h1 = app.querySelector('h1');
      if (h1) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
    }
    Motion.page(app, { late: prevPath === path }); // same-page refresh: do not re-animate visible content
    RouteProgress.done();
  }
  function start() {
    window.addEventListener('hashchange', onHashChange);
    window.addEventListener('popstate', () => { if (location.hash !== lastHash) onHashChange(); });
    render();
  }
  return {
    add, redirect, start, go, setQuery, parse, buildHash, render,
    get current() { return current; },
    setGuard(fn) { guard = fn; },
  };
})();

/* ---------- Repo: persistence adapter ----------
   Production: replace the bodies with API calls (GET /api/products, PUT /api/products/:id, …)
   and keep the method signatures. Every mutation must then be authorised server-side. */
const Repo = (() => {
  const cache = {};
  const read = (key, fallback) => {
    if (!(key in cache)) cache[key] = Storage.get(key, fallback);
    return cache[key];
  };
  const write = (key, value) => { cache[key] = value; Storage.set(key, value); };
  const SCHEMA = 1;
  return {
    init() {
      const v = Storage.get('schema', 0);
      if (!Storage.get('seeded', false) || v !== SCHEMA) this.reset({ silent: true });
      window.addEventListener('storage', (e) => {
        if (!e.key || !e.key.startsWith(Storage.PREFIX)) return;
        this.invalidate();
        Bus.emit('data:changed', { external: true });
      });
    },
    invalidate() { Object.keys(cache).forEach((k) => delete cache[k]); Search.invalidate(); },
    reset({ silent = false } = {}) {
      const products = seedProducts();
      write('products', products);
      write('shopCategories', deepClone(DEFAULT_SHOP_CATEGORIES));
      write('orders', seedOrders(products));
      write('settings', deepClone(DEFAULT_SETTINGS));
      write('projects', deepClone(DEFAULT_PROJECTS));
      Storage.set('seeded', true);
      Storage.set('schema', SCHEMA);
      Search.invalidate();
      if (!silent) Bus.emit('data:changed', {});
    },
    // Products
    products() { return read('products', []); },
    product(id) { return this.products().find((p) => p.id === id) || null; },
    productBySlug(slug) { return this.products().find((p) => p.slug === slug) || null; },
    saveProduct(product) {
      const list = this.products().slice();
      const p = { ...product, updatedAt: nowIso() };
      const i = list.findIndex((x) => x.id === p.id);
      if (i > -1) list[i] = p; else { p.createdAt = p.createdAt || nowIso(); list.push(p); }
      write('products', list);
      Search.invalidate();
      Bus.emit('products:changed', p);
      return p;
    },
    deleteProduct(id) {
      write('products', this.products().filter((p) => p.id !== id));
      Search.invalidate();
      Bus.emit('products:changed', { id });
    },
    replaceProducts(list) { write('products', list); Search.invalidate(); Bus.emit('products:changed', {}); },
    // Shop categories
    shopCategories() { return read('shopCategories', []).slice().sort((a, b) => a.order - b.order); },
    shopCategory(id) { return this.shopCategories().find((c) => c.id === id) || null; },
    saveShopCategories(list) { write('shopCategories', list); Search.invalidate(); Bus.emit('categories:changed'); },
    // Orders
    orders() { return read('orders', []); },
    order(id) { return this.orders().find((o) => o.id === id) || null; },
    saveOrder(order) {
      const list = this.orders().slice();
      const o = { ...order, updatedAt: nowIso() };
      const i = list.findIndex((x) => x.id === o.id);
      if (i > -1) list[i] = o; else list.push(o);
      write('orders', list);
      Bus.emit('orders:changed', o);
      return o;
    },
    // Settings
    settings() { return { ...deepClone(DEFAULT_SETTINGS), ...read('settings', {}) }; },
    saveSettings(s) { write('settings', s); Bus.emit('settings:changed', s); },
    nextOrderNumber() {
      const s = this.settings();
      s.orderSeq = (s.orderSeq || 0) + 1;
      this.saveSettings(s);
      return `CT-${new Date().getFullYear()}-${String(s.orderSeq).padStart(5, '0')}`;
    },
    // Projects
    projects() { return read('projects', []); },
    project(slug) { return this.projects().find((p) => p.slug === slug) || null; },
    saveProjects(list) { write('projects', list); Search.invalidate(); Bus.emit('projects:changed'); },
  };
})();

/* ---------- Pricing (integer cents) ---------- */
const Pricing = {
  promoState(p, at = Date.now()) {
    if (!p || !p.discountType || p.discountType === 'none') return 'none';
    const start = p.startDate ? Date.parse(`${p.startDate}T00:00:00`) : null;
    const end = p.endDate ? Date.parse(`${p.endDate}T23:59:59`) : null;
    if (start && at < start) return 'scheduled';
    if (end && at > end) return 'expired';
    return 'active';
  },
  calc(p, at = Date.now()) {
    const regular = p.regularPrice;
    let price = regular;
    if (this.promoState(p, at) === 'active') {
      if (p.discountType === 'sale' && isInt(p.salePrice) && p.salePrice > 0 && p.salePrice < regular) price = p.salePrice;
      if (p.discountType === 'percent' && isInt(p.discountValue) && p.discountValue > 0 && p.discountValue < 100) price = regular - Math.round((regular * p.discountValue) / 100);
      if (p.discountType === 'fixed' && isInt(p.discountValue) && p.discountValue > 0 && p.discountValue < regular) price = regular - p.discountValue;
    }
    const discount = regular - price;
    return { regular, price, discount, pct: Money.pct(discount, regular), onSale: discount > 0 };
  },
  describe(p) {
    switch (p.discountType) {
      case 'sale': return `Actieprijs ${Money.fmt(p.salePrice)}`;
      case 'percent': return `${p.discountValue}% korting`;
      case 'fixed': return `${Money.fmt(p.discountValue)} korting`;
      default: return 'Geen korting';
    }
  },
  html(p, { size = '' } = {}) {
    const c = this.calc(p);
    return `<div class="price${c.onSale ? ' is-sale' : ''}${size ? ` price--${size}` : ''}">
      <span class="now">${Money.fmt(c.price)}</span>
      ${c.onSale ? `<span class="was"><span class="sr-only">Normale prijs </span>${Money.fmt(c.regular)}</span><span class="off">${c.pct}% korting</span>` : ''}
    </div>`;
  },
};

/* ---------- Kenteken (Dutch registration plates) ---------- */
const Plate = {
  // All Dutch side codes (sidecodes 1–14), as letter/digit patterns of the compact plate.
  SIDECODES: [
    [/^[A-Z]{2}\d{2}\d{2}$/, [2, 2, 2]], [/^\d{2}\d{2}[A-Z]{2}$/, [2, 2, 2]], [/^\d{2}[A-Z]{2}\d{2}$/, [2, 2, 2]],
    [/^[A-Z]{2}\d{2}[A-Z]{2}$/, [2, 2, 2]], [/^[A-Z]{2}[A-Z]{2}\d{2}$/, [2, 2, 2]], [/^\d{2}[A-Z]{2}[A-Z]{2}$/, [2, 2, 2]],
    [/^\d{2}[A-Z]{3}\d$/, [2, 3, 1]], [/^\d[A-Z]{3}\d{2}$/, [1, 3, 2]], [/^[A-Z]{2}\d{3}[A-Z]$/, [2, 3, 1]],
    [/^[A-Z]\d{3}[A-Z]{2}$/, [1, 3, 2]], [/^[A-Z]{3}\d{2}[A-Z]$/, [3, 2, 1]], [/^[A-Z]\d{2}[A-Z]{3}$/, [1, 2, 3]],
    [/^\d[A-Z]{2}\d{3}$/, [1, 2, 3]], [/^\d{3}[A-Z]{2}\d$/, [3, 2, 1]],
  ],
  compact(input) { return String(input || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); },
  format(input) {
    const c = this.compact(input);
    if (c.length !== 6) return null;
    const hit = this.SIDECODES.find(([re]) => re.test(c));
    if (!hit) return null;
    const out = []; let i = 0;
    hit[1].forEach((n) => { out.push(c.slice(i, i + n)); i += n; });
    return out.join('-');
  },
  isValid(input) { return !!this.format(input); },
};

const DemoVehicleAdapter = {
  id: 'demo',
  handles(compact) { return Object.prototype.hasOwnProperty.call(DEMO_VEHICLES, compact); },
  async lookup(compact) {
    await sleep(700);
    const v = DEMO_VEHICLES[compact];
    if (v === 'unavailable') return { status: 'unavailable' };

/* RDW Open Data — "Gekentekende voertuigen" (Socrata API, CORS enabled, no key required).
   Production: call this through an own backend endpoint (GET /api/vehicle?plate=…) for caching,
   rate limiting and to keep plate look-ups out of third-party logs where possible. */
const RdwAdapter = {
  id: 'rdw',
  endpoint: 'https://opendata.rdw.nl/resource/m9d7-ebf2.json',
  async lookup(compact) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctrl && ctrl.abort(), 8000);
    try {
      const res = await fetch(`${this.endpoint}?kenteken=${encodeURIComponent(compact)}`, {
        signal: ctrl ? ctrl.signal : undefined, headers: { Accept: 'application/json' }, credentials: 'omit', referrerPolicy: 'no-referrer',
      });
      if (!res.ok) return { status: 'unavailable' };
      const rows = await res.json();
      if (!Array.isArray(rows)) return { status: 'unavailable' };
      if (!rows.length) return { status: 'not_found' };
      const r = rows[0];
      return {
        status: 'ok', source: 'rdw',
        raw: {
          kenteken: r.kenteken, merk: r.merk, handelsbenaming: r.handelsbenaming,
          datum_eerste_toelating: r.datum_eerste_toelating, voertuigsoort: r.voertuigsoort,
          inrichting: r.inrichting, type: r.type || '',
        },
      };
    } catch (e) {
      return { status: 'unavailable' };
    } finally { clearTimeout(timer); }
  },
};

const VehicleMatcher = {
  SUPPORTED_KINDS: ['personenauto', 'bedrijfsauto'],
  brandFor(merk) {
    const m = String(merk || '').toUpperCase().trim();
    return BRANDS.find((b) => b.rdw.some((r) => m === r || m.startsWith(`${r} `))) || null;
  },
  cleanName(name, brand) {
    let n = String(name || '').toUpperCase();
    [brand ? brand.name.toUpperCase() : '', ...(brand ? brand.rdw : [])].forEach((p) => { if (p && n.startsWith(`${p} `)) n = n.slice(p.length + 1); });
    return n.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z0-9]/g, '');
  },
  match(raw) {
    const year = parseInt(String(raw.datum_eerste_toelating || '').slice(0, 4), 10) || null;
    const kind = String(raw.voertuigsoort || '').toLowerCase();
    const base = {
      year, rdwBrand: raw.merk || '', rdwName: raw.handelsbenaming || '', body: raw.inrichting || '',
      firstAdmission: raw.datum_eerste_toelating || '',
    };
    if (kind && !this.SUPPORTED_KINDS.includes(kind)) return { ...base, status: 'unsupported_kind', kind: raw.voertuigsoort };
    const brand = this.brandFor(raw.merk);
    if (!brand) return { ...base, status: 'unsupported_brand' };
    const name = this.cleanName(raw.handelsbenaming, brand);
    const candidates = MODELS.filter((m) => m.brand === brand.id
      && m.match.some((t) => name.startsWith(t) && !(year && m.matchTo && m.matchTo[t] && year > m.matchTo[t]))
      && !(m.exclude || []).some((x) => name.startsWith(x)));
    if (!candidates.length) return { ...base, status: 'unknown_model', brandId: brand.id };
    const inYear = year ? candidates.filter((m) => year >= m.from && year <= (m.to || 9999)) : candidates;
    const type = String(raw.type || '').toUpperCase();
    if (type) {
      const byType = inYear.filter((m) => (m.types || []).some((t) => type.startsWith(t)));
      if (byType.length === 1) return { ...base, status: 'matched', brandId: brand.id, modelId: byType[0].id, confidence: 'type' };
    }
    if (inYear.length === 1) {
      // A known type code that contradicts the year-based generation is flagged, never silently trusted.
      const known = inYear[0].types || [];
      const conflict = !!type && known.length > 0 && !known.some((t) => type.startsWith(t));
      return { ...base, status: 'matched', brandId: brand.id, modelId: inYear[0].id, confidence: conflict ? 'unverified' : 'year' };
    }
    if (inYear.length > 1) return { ...base, status: 'ambiguous', brandId: brand.id, options: inYear.map((m) => m.id) };
    return { ...base, status: 'generation_unknown', brandId: brand.id, options: candidates.map((m) => m.id), baseName: candidates[0].base };
  },
};

const VehicleLookup = {
  /** Returns a normalised result object; never throws. */
  async lookup(input) {
    const plate = Plate.format(input);
    if (!plate) return { status: 'invalid' };
    const compact = Plate.compact(input);
    const mode = Repo.settings().vehicleLookupMode;
    const useDemo = DemoVehicleAdapter.handles(compact) || mode === 'demo';
    Analytics.track('vehicle_lookup_started', { source: useDemo ? 'demo' : 'rdw' });
    const res = useDemo ? await DemoVehicleAdapter.lookup(compact) : await RdwAdapter.lookup(compact);
    if (res.status !== 'ok') {
      Analytics.track(res.status === 'not_found' ? 'vehicle_lookup_not_found' : 'vehicle_lookup_unavailable', { source: useDemo ? 'demo' : 'rdw' });
      return { ...res, plate, source: useDemo ? 'demo' : 'rdw' };
    }
    const m = VehicleMatcher.match(res.raw);
    if (m.status === 'matched') Analytics.track('vehicle_lookup_success', { brand: m.brandId, model: m.modelId, source: res.source });
    else Analytics.track('vehicle_lookup_unsupported', { reason: m.status, source: res.source });
    return { ...m, plate, source: res.source };
  },
};

/* ---------- Vehicle context ("Uw auto") ----------
   The vehicle (brand/model/year) is kept in localStorage for convenience.
   The kenteken is kept in sessionStorage only and expires after 24 hours. */
const VehicleStore = {
  PLATE_TTL: 24 * 3600 * 1000,
  get() {
    const v = Storage.get('vehicle', null);
    if (!v || !BRAND[v.brandId] || (v.modelId && !MODEL[v.modelId])) return null;
    return v;
  },
  set(v, { plate = null } = {}) {
    const clean = {
      brandId: v.brandId, modelId: v.modelId || null, year: v.year || null, body: v.body || '',
      source: v.source || 'manual', confidence: v.confidence || 'manual', rdwName: v.rdwName || '', setAt: nowIso(),
    };
    Storage.set('vehicle', clean);
    if (plate) Storage.set('plate', { value: plate, at: Date.now() }, 'session');
    else Storage.remove('plate', 'session');
    Analytics.track('vehicle_selected', { brand: clean.brandId, model: clean.modelId, source: clean.source });
    Bus.emit('vehicle:changed', clean);
    return clean;
  },
  clear() {
    Storage.remove('vehicle'); Storage.remove('plate', 'session');
    Bus.emit('vehicle:changed', null);
  },
  plate() {
    const p = Storage.get('plate', null, 'session');
    if (!p) return null;
    if (Date.now() - p.at > this.PLATE_TTL) { Storage.remove('plate', 'session'); return null; }
    return p.value;
  },
  forgetPlate() { Storage.remove('plate', 'session'); Bus.emit('vehicle:changed', this.get()); },
  name(v = this.get()) { if (!v) return ''; return v.modelId ? modelLabel(v.modelId) : BRAND[v.brandId].name; },
  short(v = this.get()) { if (!v) return ''; return v.modelId ? MODEL[v.modelId].name : BRAND[v.brandId].name; },
  meta(v = this.get()) {
    if (!v) return '';
    const parts = [];
    if (v.year) parts.push(String(v.year));
    else if (v.modelId) parts.push(modelYears(MODEL[v.modelId]));
    if (v.body) parts.push(v.body.charAt(0).toUpperCase() + v.body.slice(1).toLowerCase());
    return parts.join(' · ');
  },
  sourceLabel(v = this.get()) {
    if (!v) return '';
    return { rdw: 'Bron: RDW Open Data', demo: 'Demo-gegevens', manual: 'Handmatig gekozen' }[v.source] || '';
  },
};

/* ---------- Saved items & recently viewed ---------- */
const Saved = {
  all() { return Storage.get('saved', { retrofits: [], products: [] }); },
  has(type, id) { return (this.all()[type] || []).includes(id); },
  toggle(type, id) {
    const s = this.all();
    const list = s[type] || [];
    const on = !list.includes(id);
    s[type] = on ? [id, ...list] : list.filter((x) => x !== id);
    Storage.set('saved', s);
    if (on) Analytics.track(type === 'products' ? 'product_saved' : 'retrofit_saved', { id });
    Bus.emit('saved:changed', s);
    return on;
  },
  remove(type, id) { const s = this.all(); s[type] = (s[type] || []).filter((x) => x !== id); Storage.set('saved', s); Bus.emit('saved:changed', s); },
  retrofits() { return this.all().retrofits.map((s) => RETROFIT[s]).filter(Boolean); },
  products() { return this.all().products.map((id) => Repo.product(id)).filter(isPublicProduct); },
  count() { return this.retrofits().length + this.products().length; },
};
const Recent = {
  add(type, id) {
    const list = Storage.get('recent', []).filter((r) => !(r.type === type && r.id === id));
    list.unshift({ type, id, at: Date.now() });
    Storage.set('recent', list.slice(0, 12));
  },
  list(exclude) {
    return Storage.get('recent', []).filter((r) => !(exclude && r.type === exclude.type && r.id === exclude.id)).map((r) => {
      if (r.type === 'retrofit') { const it = RETROFIT[r.id]; return it ? { type: r.type, item: it } : null; }
      if (r.type === 'product') { const p = Repo.product(r.id); return isPublicProduct(p) ? { type: r.type, item: p } : null; }
      return null;
    }).filter(Boolean);
  },
  clear() { Storage.remove('recent'); },
};

/* ---------- Cart ---------- */
const Cart = {
  get() { return Storage.get('cart', { items: [] }); },
  save(cart) { Storage.set('cart', { items: cart.items, updatedAt: nowIso() }); Bus.emit('cart:changed'); },
  count() { return this.get().items.reduce((s, i) => s + i.qty, 0); },
  qtyOf(productId) { const it = this.get().items.find((i) => i.productId === productId); return it ? it.qty : 0; },
  add(productId, qty = 1) {
    const p = Repo.product(productId);
    if (!isPublicProduct(p)) return { ok: false, message: 'Dit product is niet beschikbaar.' };
    const max = Stock.max(p);
    if (max <= 0) return { ok: false, message: `“${p.name}” is uitverkocht.` };
    const cart = this.get();
    const it = cart.items.find((i) => i.productId === productId);
    const current = it ? it.qty : 0;
    const want = current + Math.max(1, qty | 0);
    const next = Math.min(want, max);
    if (next === current) return { ok: false, message: `U heeft al het maximaal beschikbare aantal (${max}) in uw winkelmand.` };
    const price = Pricing.calc(p).price;
    if (it) { it.qty = next; it.priceSeen = price; } else cart.items.push({ productId, qty: next, priceSeen: price, addedAt: nowIso() });
    this.save(cart);
    Analytics.track('product_added_to_cart', { id: productId, qty: next - current });
    return { ok: true, limited: next < want, added: next - current, qty: next, max };
  },
  setQty(productId, qty) {
    const p = Repo.product(productId);
    const cart = this.get();
    const it = cart.items.find((i) => i.productId === productId);
    if (!it || !p) return { ok: false };
    const max = Stock.max(p);
    const next = clamp(parseInt(qty, 10) || 1, 1, Math.max(1, max));
    it.qty = next;
    this.save(cart);
    return { ok: true, qty: next, limited: next < (parseInt(qty, 10) || 1) };
  },
  remove(productId) { const cart = this.get(); cart.items = cart.items.filter((i) => i.productId !== productId); this.save(cart); },
  clear() { this.save({ items: [] }); },
  /** Re-validates the cart against current product data, corrects it and returns notices. */
  validate() {
    const cart = this.get();
    const notices = [];
    let changed = false;
    const items = [];
    cart.items.forEach((it) => {
      const p = Repo.product(it.productId);
      if (!p || p.archived) { notices.push('Een product in uw winkelmand is niet meer beschikbaar en is verwijderd.'); changed = true; return; }
      if (!p.active) { notices.push(`“${p.name}” is momenteel niet beschikbaar en is uit uw winkelmand verwijderd.`); changed = true; return; }
      const max = Stock.max(p);
      if (max <= 0) { notices.push(`“${p.name}” is uitverkocht en is uit uw winkelmand verwijderd.`); changed = true; return; }
      const qty = clamp(parseInt(it.qty, 10) || 1, 1, max);
      if (qty !== it.qty) { notices.push(`Van “${p.name}” zijn nog ${max} stuks beschikbaar. Het aantal is aangepast.`); changed = true; }
      const price = Pricing.calc(p).price;
      if (it.priceSeen != null && it.priceSeen !== price) {
        notices.push(`De prijs van “${p.name}” is gewijzigd van ${Money.fmt(it.priceSeen)} naar ${Money.fmt(price)}.`);
        changed = true;
      }
      items.push({ productId: p.id, qty, priceSeen: price, addedAt: it.addedAt });
    });
    if (changed) this.save({ items });
    return { notices, changed };
  },
  lines() {
    return this.get().items.map((it) => {
      const p = Repo.product(it.productId);
      if (!isPublicProduct(p)) return null;
      const pr = Pricing.calc(p);
      return { product: p, qty: it.qty, unitRegular: pr.regular, unitPrice: pr.price, lineRegular: pr.regular * it.qty, lineTotal: pr.price * it.qty, pricing: pr };
    }).filter(Boolean);
  },
};
function computeTotals(lines, shipping = 0) {
  const settings = Repo.settings();
  const subtotalRegular = lines.reduce((s, l) => s + l.lineRegular, 0);
  const subtotal = lines.reduce((s, l) => s + l.lineTotal, 0);
  const total = subtotal + shipping;
  const rate = settings.vat.rate;
  return {
    subtotalRegular, discountTotal: subtotalRegular - subtotal, subtotal, shipping, total,
    vat: { rate, amount: settings.vat.pricesIncludeVat ? Math.round((total * rate) / (100 + rate)) : 0, included: settings.vat.pricesIncludeVat },
  };
}

/* ---------- Orders ---------- */
const ORDER_STATUS = {
  WACHT_OP_BETALING: { label: 'Wacht op betaling', cls: 'check' },
  BETAALD: { label: 'Betaald', cls: 'ok' },
  BETALING_MISLUKT: { label: 'Betaling mislukt', cls: 'contact' },
  GEANNULEERD: { label: 'Geannuleerd', cls: 'neutral' },
  IN_BEHANDELING: { label: 'In behandeling', cls: 'variant' },
  AFGEROND: { label: 'Afgerond', cls: 'ok' },
};
const ORDER_TRANSITIONS = {
  WACHT_OP_BETALING: ['GEANNULEERD'],
  BETAALD: ['IN_BEHANDELING', 'AFGEROND', 'GEANNULEERD'],
  IN_BEHANDELING: ['AFGEROND', 'GEANNULEERD'],
  BETALING_MISLUKT: ['GEANNULEERD'],
  GEANNULEERD: [],
  AFGEROND: [],
};
const PAYMENT_STATUS = { open: 'Open', pending: 'In verwerking', paid: 'Betaald', failed: 'Mislukt', canceled: 'Geannuleerd', expired: 'Verlopen' };
const orderBadge = (status) => { const s = ORDER_STATUS[status] || { label: status, cls: 'neutral' }; return `<span class="status status--${s.cls}">${esc(s.label)}</span>`; };

const OrderService = {
  /* Simulated webhook handler. Production: POST /api/webhooks/mollie with only a payment id.
     The server re-fetches the payment from Mollie (never trusts the request body), then
     updates the order idempotently. */
  async onPaymentWebhook(paymentId) {
    const payment = await Payments.getPayment(paymentId);
    const order = Repo.orders().find((o) => (o.payments || []).some((p) => p.id === paymentId));
    if (!order || !payment) return null;
    if (order.paymentId !== paymentId) return order; // stale payment for this order
    if (order.paymentStatus === payment.status) return order; // idempotent
    const o = deepClone(order);
    o.paymentStatus = payment.status;
    const map = { paid: 'BETAALD', failed: 'BETALING_MISLUKT', canceled: 'GEANNULEERD', expired: 'GEANNULEERD', open: 'WACHT_OP_BETALING', pending: 'WACHT_OP_BETALING' };
    const next = map[payment.status];
    const locked = ['BETAALD', 'IN_BEHANDELING', 'AFGEROND'].includes(o.orderStatus);
    if (!locked && next && next !== o.orderStatus) {
      o.orderStatus = next;
      o.history.push({ at: nowIso(), status: next, note: `Betaalstatus: ${PAYMENT_STATUS[payment.status]}` });
    } else if (payment.status === 'pending') {
      o.history.push({ at: nowIso(), status: o.orderStatus, note: 'Betaling wordt verwerkt' });
    }
    if (payment.status === 'paid' && !o.stockApplied) {
      o.items.forEach((line) => {
        const p = Repo.product(line.productId);
        if (p && p.trackStock) {
          if (p.stock < line.qty) o.history.push({ at: nowIso(), status: o.orderStatus, note: `Voorraadconflict: ${line.name} (${p.stock} op voorraad, ${line.qty} besteld)` });
          Repo.saveProduct({ ...p, stock: Math.max(0, p.stock - line.qty) });
        }
      });
      o.stockApplied = true;
      const key = Storage.get('checkoutKey', null, 'session');
      if (key && key.key === o.idempotencyKey) { Cart.clear(); Storage.remove('checkoutKey', 'session'); }
    }
    return Repo.saveOrder(o);
  },
  setStatus(orderId, status, note = '') {
    const o = deepClone(Repo.order(orderId));
    if (!o) return { ok: false, message: 'Bestelling niet gevonden.' };
    if (!(ORDER_TRANSITIONS[o.orderStatus] || []).includes(status)) return { ok: false, message: 'Deze statuswijziging is niet toegestaan.' };
    o.orderStatus = status;
    o.history.push({ at: nowIso(), status, note: note || `Status gewijzigd naar ${ORDER_STATUS[status].label}` });
    Repo.saveOrder(o);
    return { ok: true };
  },
};

/* ---------- Checkout (SIMULATED SERVER) ----------
   PRODUCTION_PAYMENT_FLOW (server-side, Mollie test mode first):
    1. Browser sends POST /api/checkout { items: [{productId, qty}], customer, delivery } + Idempotency-Key.
    2. Server loads the products from the database and validates active state, stock and quantities.
    3. Server calculates prices, discounts, shipping and VAT itself (client prices are never trusted).
    4. Server creates the order with immutable snapshots, status WACHT_OP_BETALING.
    5. Server creates a Mollie payment (amount from the order, redirectUrl + webhookUrl, metadata.orderId).
    6. Server returns the Mollie checkout URL; the browser redirects the customer to Mollie.
    7. Customer returns to /bestelling/:id — the page shows the status the SERVER reports.
    8. Mollie calls the webhook; the server fetches the payment from Mollie and updates the order.
    9. Only the webhook (server) marks an order as BETAALD. Live mode is switched on manually. */
function validateCheckout(form, method) {
  const e = {};
  if (!form.firstName || form.firstName.trim().length < 1) e.firstName = 'Vul uw voornaam in.';
  if (!form.lastName || form.lastName.trim().length < 1) e.lastName = 'Vul uw achternaam in.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(form.email || '')) e.email = 'Vul een geldig e-mailadres in.';
  if (!/^(\+|0)[0-9\s-]{8,15}$/.test((form.phone || '').trim())) e.phone = 'Vul een geldig telefoonnummer in.';
  if (!method) e.delivery = 'Kies een leveringsmethode.';
  if (method && method.requiresAddress) {
    if (!form.street || !form.street.trim()) e.street = 'Vul uw straat in.';
    if (!form.houseNumber || !/^\d+\s?[a-zA-Z0-9-]{0,6}$/.test(form.houseNumber.trim())) e.houseNumber = 'Vul een geldig huisnummer in.';
    if (!/^\d{4}\s?[A-Za-z]{2}$/.test((form.postal || '').trim())) e.postal = 'Vul een geldige postcode in (1234 AB).';
    if (!form.city || !form.city.trim()) e.city = 'Vul uw woonplaats in.';
  }
  return e;
}
const CheckoutService = {
  key() {
    const fp = Cart.get().items.map((i) => `${i.productId}x${i.qty}`).sort().join('|');
    let k = Storage.get('checkoutKey', null, 'session');
    if (!k || k.fp !== fp) { k = { fp, key: uid('idem') }; Storage.set('checkoutKey', k, 'session'); }
    return k.key;
  },
  async placeOrder(form) {
    await sleep(650);
    const { notices } = Cart.validate();
    if (notices.length) return { ok: false, code: 'cart_changed', notices };
    const lines = Cart.lines();
    if (!lines.length) return { ok: false, code: 'empty' };
    const settings = Repo.settings();
    const method = settings.shipping.find((m) => m.id === form.delivery && m.enabled);
    const errors = validateCheckout(form, method);
    if (Object.keys(errors).length) return { ok: false, code: 'invalid', errors };
    const idem = this.key();
    const totals = computeTotals(lines, method.price);
    const items = lines.map((l) => ({
      productId: l.product.id, sku: l.product.sku, name: l.product.name,
      image: (l.product.images[0] || '').length < 4096 ? l.product.images[0] : `art:${(l.product.images.find((i) => i.startsWith('art:')) || 'art:box').split(':')[1] || 'box'}:0`,
      qty: l.qty, unitRegular: l.unitRegular, unitPrice: l.unitPrice,
      discountType: l.pricing.onSale ? l.product.discountType : 'none',
      discountLabel: l.pricing.onSale ? `−${l.pricing.pct}%` : '',
      lineRegular: l.lineRegular, lineTotal: l.lineTotal,
    }));
    const customer = {
      firstName: form.firstName.trim(), lastName: form.lastName.trim(), email: form.email.trim(), phone: form.phone.trim(),
      address: method.requiresAddress ? { street: form.street.trim(), houseNumber: form.houseNumber.trim(), postal: form.postal.trim().toUpperCase(), city: form.city.trim() } : null,
    };
    const v = VehicleStore.get();
    const existing = Repo.orders().find((o) => o.idempotencyKey === idem && o.orderStatus === 'WACHT_OP_BETALING');
    let order;
    if (existing) {
      order = { ...deepClone(existing), customer, delivery: { method: method.id, label: method.label, price: method.price }, items, ...totals, shipping: method.price, note: form.note || '' };
      order.history.push({ at: nowIso(), status: order.orderStatus, note: 'Dezelfde bestelling opnieuw bevestigd (dubbele bestelling voorkomen)' });
    } else {
      order = {
        id: uid('ord'), orderNumber: Repo.nextOrderNumber(), idempotencyKey: idem, isDemo: true,
        customer, delivery: { method: method.id, label: method.label, price: method.price },
        vehicle: v ? { label: VehicleStore.name(v), year: v.year || null } : null,
        note: (form.note || '').trim(), items, ...totals, currency: 'EUR',
        paymentStatus: 'open', orderStatus: 'WACHT_OP_BETALING', paymentId: null, payments: [],
        history: [{ at: nowIso(), status: 'WACHT_OP_BETALING', note: 'Bestelling aangemaakt' }],
        stockApplied: false, createdAt: nowIso(),
      };
    }
    Repo.saveOrder(order);
    const open = (order.payments || []).find((p) => p.id === order.paymentId && p.status === 'open');
    const payment = open || await Payments.createPayment(order.id);
    return { ok: true, order: Repo.order(order.id), checkoutUrl: payment.checkoutUrl };
  },
  async retryPayment(orderId) {
    const order = Repo.order(orderId);
    if (!order) return { ok: false, message: 'Bestelling niet gevonden.' };
    if (!['BETALING_MISLUKT', 'GEANNULEERD', 'WACHT_OP_BETALING'].includes(order.orderStatus)) return { ok: false, message: 'Deze bestelling kan niet opnieuw worden betaald.' };
    for (const line of order.items) {
      const p = Repo.product(line.productId);
      if (!isPublicProduct(p) || Stock.max(p) < line.qty) return { ok: false, code: 'stock', message: `“${line.name}” is niet meer in de gevraagde hoeveelheid beschikbaar.` };
    }
    const payment = await Payments.createPayment(orderId);
    return { ok: true, checkoutUrl: payment.checkoutUrl };
  },
};

   which talks to Mollie with the secret API key (never in the browser). */
const DemoPaymentAdapter = {
  id: 'demo', testMode: true, label: 'Demo-betaalomgeving (testmodus)',
  async createPayment(orderId) {
    await sleep(350);
    const o = deepClone(Repo.order(orderId));
    const id = `tr_test_${Math.random().toString(36).slice(2, 12)}`;
    const p = { id, status: 'open', amount: o.total, createdAt: nowIso(), updatedAt: nowIso(), checkoutUrl: `#/betaling/${o.id}` };
    o.payments = (o.payments || []).concat(p);
    o.paymentId = id;
    o.paymentStatus = 'open';
    if (o.orderStatus !== 'WACHT_OP_BETALING') {
      o.orderStatus = 'WACHT_OP_BETALING';
      o.history.push({ at: nowIso(), status: 'WACHT_OP_BETALING', note: 'Nieuwe betaalpoging gestart' });
    }
    Repo.saveOrder(o);
    return p;
  },
  async getPayment(paymentId) {
    for (const o of Repo.orders()) {
      const p = (o.payments || []).find((x) => x.id === paymentId);
      if (p) return { id: p.id, status: p.status, amount: p.amount };
    }
    return null;
  },
  /* Demo only: the tester chooses the outcome on the simulated payment page.
     That mimics the provider changing the status and then calling our webhook. */
  async simulate(orderId, status) {
    await sleep(500);
    const o = deepClone(Repo.order(orderId));
    const p = (o.payments || []).find((x) => x.id === o.paymentId);
    if (!p) return null;
    p.status = status; p.updatedAt = nowIso();
    Repo.saveOrder(o);
    return OrderService.onPaymentWebhook(p.id);
  },
};
const Payments = DemoPaymentAdapter;

/* ---------- Search ---------- */
const Search = {
  index: null,
  TYPE_LABEL: { CATEGORIE: 'Categorie', DIENST: 'Dienst', RETROFIT: 'Retrofit', MODEL: 'Model', PRODUCT: 'Product', PROJECT: 'Project' },
  TYPE_ORDER: ['CATEGORIE', 'DIENST', 'RETROFIT', 'MODEL', 'PRODUCT', 'PROJECT'],
  TYPE_BOOST: { CATEGORIE: 6, DIENST: 5, RETROFIT: 0, MODEL: 4, PRODUCT: 0, PROJECT: -2 },
  invalidate() { this.index = null; },
  build() {
    const docs = [];
    RETROFITS.forEach((r) => docs.push({
      type: 'RETROFIT', id: r.slug, title: r.title, sub: `${CATEGORY[r.cat].name} · ${retrofitModelsText(r)}`, href: `#/mogelijkheden/${r.slug}`,
      text: [r.name, r.short, (r.keywords || []).join(' '), r.models.map(modelLabel).join(' '), Compat.brandsOf(r).map((b) => BRAND[b].name).join(' ')].join(' '),
      catText: normText(CATEGORY[r.cat].name), catIdx: CATEGORIES.findIndex((c) => c.id === r.cat), models: r.models, brands: Compat.brandsOf(r), wide: r.scope === 'brand',
    }));
    SERVICES.forEach((s) => docs.push({ type: 'DIENST', id: s.slug, title: s.title, sub: s.short, href: `#/diensten/${s.slug}`, text: [s.short, s.keywords.join(' ')].join(' ') }));
    CATEGORIES.forEach((c) => docs.push({ type: 'CATEGORIE', id: c.id, title: c.name, sub: c.text, href: `#/mogelijkheden?cat=${c.id}`, text: c.text }));
    MODELS.forEach((m) => {
      const n = Compat.countForModel(m.id);
      docs.push({ type: 'MODEL', id: m.id, title: modelLabel(m.id), sub: `${modelYears(m)} · ${plural(n, 'mogelijkheid', 'mogelijkheden')}`, href: `#/mogelijkheden?merk=${m.brand}&model=${m.id}`, text: `${BRAND[m.brand].name} ${m.base}` });
    });
    Repo.projects().filter((p) => p.active).forEach((p) => docs.push({ type: 'PROJECT', id: p.slug, title: p.title, sub: p.vehicle, href: `#/projecten/${p.slug}`, text: [p.vehicle, p.short, p.tag].join(' '), models: p.models || [], brands: p.brands || [], wide: !(p.models || []).length }));
    Repo.products().filter(isPublicProduct).forEach((p) => docs.push({
      type: 'PRODUCT', id: p.id, title: p.name, sub: `${Money.fmt(Pricing.calc(p).price)} · ${(Repo.shopCategory(p.category) || {}).name || 'Webshop'}`, href: `#/webshop/${p.slug}`,
      text: [p.shortDescription, (Repo.shopCategory(p.category) || {}).name, p.sku, (p.compatibility.models || []).map(modelLabel).join(' ')].join(' '),
      models: p.compatibility.models || [], brands: p.compatibility.brands || [], wide: !(p.compatibility.models || []).length,
    }));
    docs.forEach((d) => { d.nTitle = normText(d.title); d.nText = normText(`${d.title} ${d.text}`); d.words = d.nText.split(' '); });
    // Per result type: its words and full text, to tell meaningful query words from filler.
    this.vocab = {};
    docs.forEach((d) => {
      const v = (this.vocab[d.type] = this.vocab[d.type] || { words: new Set(), text: '' });
      d.words.forEach((w) => v.words.add(w));
      if (d.catText) d.catText.split(' ').forEach((w) => v.words.add(w));
      v.text += ` ${d.nText}`;
    });
    this.index = docs;
  },
  /* Synonym phrases for a query. A multi-word query only expands through multi-word terms
     ("cruise control", "360 camera"); single words are expanded per word in score(). */
  expand(nq, { phrase = false } = {}) {
    const phrases = [];
    SYNONYMS.forEach((group) => {
      const g = group.map(normText);
      const hit = g.some((t) => nq === t || (nq.length >= 3 && t.startsWith(nq))
        || ((!phrase || t.includes(' ')) && (` ${nq} `).includes(` ${t} `)));
      if (hit) g.forEach((t) => { if (t !== nq) phrases.push(t); });
    });
    return uniq(phrases);
  },
  /* Finds brand/model mentions ("golf 7 camera", "a4 b9 carplay", "t6 camera") and returns
     the rest of the query, so the remaining words are matched against the option itself. */
  parseVehicle(nq) {
    const words = nq.split(' ');
    const set = new Set(words);
    for (let i = 0; i < words.length - 1; i++) set.add(words[i] + words[i + 1]);
    const used = new Set();
    let brand = null;
    BRANDS.forEach((b) => [b.id, normText(b.name), ...(b.id === 'volkswagen' ? ['vw'] : [])].forEach((t) => { if (set.has(t)) { brand = b.id; used.add(t); } }));
    const hits = [];
    MODELS.forEach((m) => {
      if (brand && m.brand !== brand) return;
      const baseW = normText(m.base).split(' ');
      const baseC = baseW.join('');
      const codes = normText(m.name).split(' ').filter((w) => !baseW.includes(w));
      const codeHit = codes.filter((c) => set.has(c) || set.has(baseC + c));
      const baseHit = baseW.every((w) => set.has(w)) || set.has(baseC) || codes.some((c) => set.has(baseC + c));
      // A distinctive generation code on its own also counts ("t6", "b8", "8v").
      if (!baseHit && !codeHit.some((c) => c.length > 1 && /\d/.test(c) && /[a-z]/.test(c))) return;
      hits.push({ m, baseW, baseC, codes, codeHit, baseHit });
    });
    if (!hits.length) return { brand, models: null, rest: words.filter((w) => !used.has(w)).join(' ') };
    let pick = hits.filter((h) => h.codeHit.length);
    if (!pick.length) pick = hits;
    // A year narrows the generation ("golf 2018 camera" → Golf 7).
    const yw = words.find((w) => /^(19|20)\d\d$/.test(w));
    if (yw) {
      used.add(yw);
      const inYear = pick.filter((h) => +yw >= h.m.from && +yw <= (h.m.to || 9999));
      if (inYear.length) pick = inYear;
    }
    const longest = Math.max(...pick.map((h) => (h.baseHit ? h.baseW.length : 0)));
    pick = pick.filter((h) => (h.baseHit ? h.baseW.length : 0) === longest);
    pick.forEach((h) => { if (h.baseHit) { h.baseW.forEach((w) => used.add(w)); used.add(h.baseC); } h.codeHit.forEach((c) => { used.add(c); used.add(h.baseC + c); }); });
    const rest = words.filter((w, i) => !used.has(w) && !(i < words.length - 1 && used.has(w + words[i + 1])) && !(i > 0 && used.has(words[i - 1] + w))).join(' ');
    return { brand: brand || pick[0].m.brand, models: pick.map((h) => h.m.id), rest };
  },
  /* Text relevance of one document. Multi-word queries need every word to match (directly, via a
     synonym or via the category name), unless the whole phrase matched. Words that occur nowhere in
     the index ("inbouwen", "gti", a year) are ignored. Returns { score, viaCat }. */
  score(d, nq, ctx) {
    let score = 0;
    if (d.nTitle === nq) score += 100;
    if (d.nTitle.startsWith(nq)) score += 40;
    if (d.nTitle.includes(nq)) score += 30; else if (d.nText.includes(nq)) score += 16;
    let syn = 0;
    ctx.phraseSyn.forEach((ph) => { syn = Math.max(syn, d.nTitle.includes(ph) ? 14 : (d.nText.includes(ph) ? 9 : 0)); });
    score += syn;
    const { tokens, tokenSyn } = ctx.forType(d.type);
    let viaCat = false;
    const every = tokens.length > 0 && tokens.every((t, i) => {
      if (d.words.some((w) => w.startsWith(t)) || tokenSyn[i].some((ph) => d.nText.includes(ph))) return true;
      if (d.catText && d.catText.split(' ').some((w) => w.startsWith(t))) { viaCat = true; return true; }
      return false;
    });
    if (every) score += viaCat ? 8 : (tokens.length > 1 ? 22 : 12);
    else if (tokens.length > 1 && score < 30 && !syn) score = 0;
    return { score, viaCat: every && viaCat && score < 30 };
  },
  /* Query words that mean something for a result type; the rest ("inbouwen", "gti", a year) is
     ignored for that type instead of excluding every result. */
  context(nq) {
    const all = nq.split(' ').filter((t) => t.length > 1);
    const syn = new Map(all.map((t) => [t, this.expand(t)]));
    const cache = {};
    return {
      all,
      phraseSyn: this.expand(nq, { phrase: all.length > 1 }),
      forType: (type) => {
        if (!cache[type]) {
          const v = this.vocab[type] || { words: new Set(), text: '' };
          const words = [...v.words];
          const known = all.filter((t) => words.some((w) => w.startsWith(t)) || syn.get(t).some((ph) => v.text.includes(ph)));
          cache[type] = { tokens: known, tokenSyn: known.map((t) => syn.get(t)) };
        }
        return cache[type];
      },
    };
  },
  query(q, { limit = 8, types = null, perType = 3 } = {}) {
    if (!this.index) this.build();
    const nq = normText(q);
    if (nq.length < 2) return [];
    const pv = this.parseVehicle(nq);
    const scoped = !!(pv.models || pv.brand);
    let rq = scoped ? pv.rest : nq;
    if (rq && !rq.split(' ').some((t) => t.length > 1)) rq = ''; // "golf 7.5", "t6.1": only a facelift suffix left
    const sc = this.context(rq);
    const modelSet = pv.models ? new Set(pv.models) : null;
    const v = VehicleStore.get();
    const out = [];
    this.index.forEach((d) => {
      if (types && !types.includes(d.type)) return;
      let score = 0; let viaCat = false;
      const run = (txt) => { const r = this.score(d, txt, sc); viaCat = r.viaCat; return r.score; };
      if (!scoped) score = run(nq);
      else if (d.type === 'MODEL') {
        if (modelSet) { if (!modelSet.has(d.id)) return; score = 60 + (rq ? 0 : 40); } else { if (rq || MODEL[d.id].brand !== pv.brand) return; score = 40; }
      } else if (d.models) {
        const inModel = modelSet ? d.models.some((m) => modelSet.has(m)) : false;
        const inBrand = !(d.brands || []).length || d.brands.includes(pv.brand);
        if (modelSet && !inModel && !(d.wide && inBrand)) return;
        if (!modelSet && !inBrand) return;
        score = rq ? run(rq) : 20;
        if (!score) return;
        score += inModel ? 30 : (modelSet ? -10 : 10);
      } else {
        if (!rq) return;
        score = run(rq);
      }
      if (score <= 0) return;
      if (v && d.models && d.models.includes(v.modelId)) score += 15;
      out.push({ ...d, viaCat, score: score + (this.TYPE_BOOST[d.type] || 0) });
    });
    // Options that only match through their category name give way when others match directly.
    const direct = out.some((o) => o.type === 'RETROFIT' && !o.viaCat);
    if (direct) for (let i = out.length - 1; i >= 0; i--) if (out[i].viaCat) out.splice(i, 1);
    out.sort((a, b) => b.score - a.score || ((a.catIdx ?? 99) - (b.catIdx ?? 99)) || a.title.localeCompare(b.title, 'nl'));
    if (!perType) return out.slice(0, limit);
    const counts = {};
    return out.filter((r) => { counts[r.type] = (counts[r.type] || 0) + 1; return counts[r.type] <= perType; }).slice(0, limit);
  },
  highlight(title, q) {
    const t = esc(title);
    const needle = String(q || '').trim();
    if (needle.length < 2) return t;
    const i = title.toLowerCase().indexOf(needle.toLowerCase());
    if (i < 0) return t;
    return `${esc(title.slice(0, i))}<mark>${esc(title.slice(i, i + needle.length))}</mark>${esc(title.slice(i + needle.length))}`;
  },
};

const Art = {
  svg(kind = 'box', variant = 0) {
    const shape = ART_SHAPES[kind] || ART_SHAPES.box;
    const v = Number(variant) || 0;
    const dark = v === 1;
    const bg = dark ? '#1C2025' : (v === 2 ? '#EDF0F3' : '#F3F5F7');
    const grid = dark ? 'rgba(255,255,255,.05)' : 'rgba(17,20,26,.055)';
    const ink = dark ? '#E7E9EC' : '#20252C';
    const accent = dark ? '#E7737E' : '#B51625';
    const label = dark ? 'rgba(255,255,255,.42)' : 'rgba(17,20,26,.42)';
    let g = '';
    for (let x = 20; x < 400; x += 20) g += `M${x} 0V300`;
    for (let y = 20; y < 300; y += 20) g += `M0 ${y}H400`;
    const scale = v === 1 ? 1.55 : 1.3;
    const tx = 200 - 60 * scale + (v === 2 ? -40 : 0);
    const ty = 146 - 60 * scale;
    const extra = v === 2
      ? `<path d="M${tx - 6} ${ty + 128 * scale}H${tx + 126 * scale}M${tx - 6} ${ty + 124 * scale}v8M${tx + 126 * scale} ${ty + 124 * scale}v8" stroke="${accent}" stroke-width="1.2" fill="none"/>
         <path d="M300 92h56M300 112h44M300 132h50M300 152h34" stroke="${ink}" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>`
      : `<circle cx="200" cy="146" r="${v === 1 ? 128 : 118}" fill="${dark ? '#262B31' : '#FFFFFF'}" fill-opacity="${dark ? '.55' : '.7'}"/>`;
    return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <rect width="400" height="300" fill="${bg}"/><path d="${g}" stroke="${grid}" stroke-width="1"/>
      ${extra}
      <g transform="translate(${tx} ${ty}) scale(${scale})" fill="none" stroke="${ink}" stroke-width="${(2.1 / scale).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round" class="art-g">
        ${shape.replace(/class="([^"]*)"/g, (m, c) => {
          const cls = c.split(' ');
          let a = '';
          if (cls.includes('a')) a += ` stroke="${accent}"`;
          if (cls.includes('f')) a += ` fill="${cls.includes('a') ? accent : ink}"`;
          else if (cls.includes('bg')) a += ` fill="${bg}"`;
          return a;
        })}
      </g>
      <text x="16" y="286" font-family="Inter, Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.6" fill="${label}">ILLUSTRATIE</text>
    </svg>`;
  },
  html(kind, variant, alt) {
    return `<div class="art" role="img" aria-label="Illustratie${alt ? `: ${esc(alt)}` : ''}">${this.svg(kind, variant)}</div>`;
  },
};

/* Media references:  "img:<key>" embedded photo │ "art:<kind>:<variant>" illustration │ https://… / data:image URL */
const Media = {
  src(ref) {
    if (!ref) return null;
    if (ref.startsWith('img:')) return (window.CT_IMAGES || {})[ref.slice(4)] || null;
    if (/^(https?:|data:image\/)/i.test(ref)) return ref;
    return null;
  },
  isPhoto(ref) { return !!ref && !ref.startsWith('art:') && !!this.src(ref); },
  html(ref, alt = '', { kind = 'box', eager = false, cls = '', sizes = '' } = {}) {
    if (!ref || ref.startsWith('art:')) {
      const [, k, v] = String(ref || `art:${kind}:0`).split(':');
      return Art.html(k || kind, v || 0, alt);
    }
    const src = this.src(ref);
    if (!src) return Art.html(kind, 0, alt);
    return `<img src="${attr(src)}" alt="${attr(alt)}"${eager ? ' fetchpriority="high"' : ' loading="lazy"'} decoding="async" data-fallback="${attr(kind)}"${cls ? ` class="${cls}"` : ''}${sizes ? ` sizes="${sizes}"` : ''}>`;
  },
  /** Replaces broken images with an illustration so the UI never shows a broken image icon. */
  installFallback() {
    document.addEventListener('error', (e) => {
      const img = e.target;
      if (!(img instanceof HTMLImageElement) || !img.dataset.fallback || img.dataset.failed) return;
      img.dataset.failed = '1';
      const wrap = document.createElement('div');
      wrap.innerHTML = Art.html(img.dataset.fallback, 0, img.alt);
      img.replaceWith(wrap.firstElementChild);
    }, true);
  },
};
const productArtKind = (p) => {
  const a = (p.images || []).find((i) => i.startsWith('art:'));
  return a ? a.split(':')[1] : 'box';
};

}).join('') + '</g></svg>';

const WhatsApp = {
  url(text) { return `https://wa.me/${COMPANY.whatsapp}?text=${encodeURIComponent(text)}`; },
  generic() {
    const v = VehicleStore.get();
    let t = 'Hallo CarTronic,\n\n';
    if (v) t += `Voertuig: ${VehicleStore.name(v)}${v.year ? ` (${v.year})` : ''}\n\n`;
    t += 'Ik heb een vraag over de mogelijkheden voor mijn auto.';
    return this.url(t);
  },
  /** Structured enquiry. Never contains internal ids. */
  enquiry({ name, vehicle, plate, year, options = [], products = [], question }) {
    const lines = ['Hallo CarTronic,', ''];
    if (name) lines.push(`Naam: ${name}`);
    lines.push(`Voertuig: ${vehicle || 'nog niet gekozen'}`);
    if (plate) lines.push(`Kenteken: ${plate}`);
    if (year) lines.push(`Bouwjaar: ${year}`);
    if (options.length) { lines.push('', 'Geselecteerde optie(s):'); options.forEach((o) => lines.push(`- ${o}`)); }
    if (products.length) { lines.push('', 'Producten:'); products.forEach((p) => lines.push(`- ${p}`)); }
    lines.push('', 'Vraag:', question || '-');
    return lines.join('\n');
  },
};
