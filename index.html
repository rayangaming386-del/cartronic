      return `<div class="acc-item${it.open ? ' is-open' : ''}">
        <h3><button class="acc-trigger" type="button" aria-expanded="${!!it.open}" aria-controls="${id}" id="${id}_t">${esc(it.title)}<span class="acc-icon" aria-hidden="true"></span></button></h3>
        <div class="acc-panel" id="${id}" role="region" aria-labelledby="${id}_t"><div><div class="acc-content">${it.html}</div></div></div>
      </div>`;
    }).join('')}</div>`;
  },
  miniItem(entry) {
    const isR = entry.type === 'retrofit';
    const it = entry.item;
    const href = isR ? `#/mogelijkheden/${it.slug}` : `#/webshop/${it.slug}`;
    const media = isR ? Media.html(retrofitImage(it), it.title, { kind: it.art }) : Media.html(it.images[0], it.name, { kind: productArtKind(it) });
    return `<div class="mini-item">
      <div class="mi-media">${media}</div>
      <div><div class="mi-type">${isR ? 'Retrofit' : 'Product'}</div><a class="mi-title stretch" href="${href}">${esc(isR ? it.title : it.name)}</a></div>
      <div class="mi-aside">${isR ? '' : `<span class="text-small tabular" style="font-weight:600">${Money.fmt(Pricing.calc(it).price)}</span>`}</div>
    </div>`;
  },
  qty({ id, value, max, size = '', label = 'Aantal' }) {
    return `<div class="qty${size ? ` qty--${size}` : ''}" data-qty="${attr(id)}">
      <button type="button" data-step="-1" aria-label="Minder"${value <= 1 ? ' disabled' : ''}>${icon('minus')}</button>
      <input type="number" inputmode="numeric" min="1" max="${max}" value="${value}" aria-label="${attr(label)}">
      <button type="button" data-step="1" aria-label="Meer"${value >= max ? ' disabled' : ''}>${icon('plus')}</button>
    </div>`;
  },
  beforeAfter(before, after, alt) {
    return `<div class="ba" data-ba style="--pos:50%">
      <img src="${attr(Media.src(before))}" alt="Voor: ${attr(alt)}" loading="lazy">
      <img class="ba-after" src="${attr(Media.src(after))}" alt="Na: ${attr(alt)}" loading="lazy">
      <span class="ba-label l">Voor</span><span class="ba-label r">Na</span>
      <input type="range" min="0" max="100" value="50" step="1" aria-label="Vergelijk voor en na">
      <span class="ba-handle" aria-hidden="true"></span>
    </div>`;
  },
  gallery(images, alt, kind) {
    const imgs = images.length ? images : [`art:${kind}:0`];
    return `<div class="gallery" data-gallery>
      <div class="gallery-main" aria-roledescription="carrousel" aria-label="Afbeeldingen van ${attr(alt)}">
        ${imgs.map((src, i) => `<div class="g-slide${i === 0 ? ' is-active' : ''}" role="group" aria-roledescription="dia" aria-label="${i + 1} van ${imgs.length}"${i ? ' aria-hidden="true"' : ''}>${Media.html(src, `${alt} (${i + 1})`, { kind, eager: i === 0 })}</div>`).join('')}
        ${imgs.length > 1 ? `<button class="gallery-nav prev" type="button" data-g="-1" aria-label="Vorige afbeelding">${icon('left')}</button>
        <button class="gallery-nav next" type="button" data-g="1" aria-label="Volgende afbeelding">${icon('right')}</button>
        <span class="gallery-count" aria-hidden="true"><span data-g-index>1</span> / ${imgs.length}</span>` : ''}
      </div>
      ${imgs.length > 1 ? `<div class="gallery-thumbs" role="group" aria-label="Kies een afbeelding">${imgs.map((src, i) => `<button type="button" data-g-to="${i}" aria-label="Afbeelding ${i + 1}" aria-current="${i === 0}">${Media.html(src, '', { kind })}</button>`).join('')}</div>` : ''}
    </div>`;
  },
};

/* Behaviour for components rendered as HTML strings */
const Behaviours = {
  mount(root) {
    // Accordions
    $$('[data-accordion] .acc-trigger', root).forEach((btn) => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.acc-item');
        const open = !item.classList.contains('is-open');
        item.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', String(open));
      });
    });
    // Galleries
    $$('[data-gallery]', root).forEach((g) => {
      const slides = $$('.g-slide', g); const thumbs = $$('[data-g-to]', g);
      if (slides.length < 2) return;
      let i = 0;
      const show = (n) => {
        i = (n + slides.length) % slides.length;
        slides.forEach((s, k) => { s.classList.toggle('is-active', k === i); s.setAttribute('aria-hidden', String(k !== i)); });
        thumbs.forEach((t, k) => t.setAttribute('aria-current', String(k === i)));
        const idx = $('[data-g-index]', g); if (idx) idx.textContent = String(i + 1);
      };
      g.addEventListener('click', (e) => {
        const nav = e.target.closest('[data-g]'); if (nav) show(i + Number(nav.dataset.g));
        const to = e.target.closest('[data-g-to]'); if (to) show(Number(to.dataset.gTo));
      });
      const main = $('.gallery-main', g);
      main.tabIndex = 0;
      main.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') show(i + 1); if (e.key === 'ArrowLeft') show(i - 1); });
      let sx = null; let sy = null;
      main.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
      main.addEventListener('touchend', (e) => {
        if (sx == null) return;
        const dx = e.changedTouches[0].clientX - sx; const dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) show(i + (dx < 0 ? 1 : -1));
        sx = null;
      });
    });
    // Before / after sliders (mouse, touch and keyboard via the native range input)
    $$('[data-ba]', root).forEach((ba) => {
      const input = $('input[type="range"]', ba);
      const set = (v) => ba.style.setProperty('--pos', `${clamp(Number(v), 0, 100)}%`);
      input.addEventListener('input', () => set(input.value));
    });
    // Quantity steppers (generic: dispatch a change event on the input)
    $$('[data-qty]', root).forEach((q) => {
      const input = $('input', q);
      q.addEventListener('click', (e) => {
        const b = e.target.closest('[data-step]'); if (!b) return;
        const max = Number(input.max) || 99;
        input.value = clamp((parseInt(input.value, 10) || 1) + Number(b.dataset.step), 1, max);
        input.dispatchEvent(new Event('change', { bubbles: true }));
      });
      input.addEventListener('change', () => {
        const max = Number(input.max) || 99;
        input.value = clamp(parseInt(input.value, 10) || 1, 1, max);
        $('[data-step="-1"]', q).disabled = Number(input.value) <= 1;
        $('[data-step="1"]', q).disabled = Number(input.value) >= max;
      });
    });
  },
};

/* ---------- Vehicle finder (kenteken + manual) ---------- */
let finderSeq = 0;
const VehicleFinder = {
  html({ tab = 'plate', context = 'home' } = {}) {
    const id = `fx${++finderSeq}`;
    const brandOpts = BRANDS.map((b) => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
    return `<div class="finder" data-finder data-context="${context}" data-id="${id}">
      <div class="segmented finder-tabs" role="tablist" aria-label="Zoek uw auto">
        <button type="button" role="tab" id="${id}-t-plate" aria-controls="${id}-p-plate" aria-selected="${tab === 'plate'}" tabindex="${tab === 'plate' ? 0 : -1}" data-tab="plate">${icon('search')} Kenteken<span class="hide-xs">&nbsp;invullen</span></button>
        <button type="button" role="tab" id="${id}-t-manual" aria-controls="${id}-p-manual" aria-selected="${tab === 'manual'}" tabindex="${tab === 'manual' ? 0 : -1}" data-tab="manual">${icon('car')} Handmatig<span class="hide-xs">&nbsp;selecteren</span></button>
      </div>
      <div role="tabpanel" id="${id}-p-plate" aria-labelledby="${id}-t-plate" data-panel="plate"${tab === 'plate' ? '' : ' hidden'}>
        <form class="finder-form finder-form--plate" data-plate-form novalidate>
          <div class="field">
            <label for="${id}-plate">Kenteken</label>
            <div class="plate" data-plate-box><span class="plate-eu" aria-hidden="true">${EU_STARS}NL</span>
              <input id="${id}-plate" name="plate" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" placeholder="AB-123-C" aria-describedby="${id}-plate-hint ${id}-plate-err">
            </div>
            <span class="field-error" id="${id}-plate-err" data-plate-err></span>
          </div>
          <button class="btn btn--primary" type="submit" data-plate-submit>${icon('search')} Zoek voertuig</button>
        </form>
        <div class="finder-foot">
          <span id="${id}-plate-hint">Uw auto wordt opgezocht via RDW Open Data. Het kenteken bewaren we alleen tijdelijk in deze browser.</span>
          <button type="button" data-demo-toggle aria-expanded="false">Demo-kentekens</button>
        </div>
        <div class="demo-plates" data-demo-list hidden>
          <span class="lbl">Testkentekens (demo-gegevens, geen RDW):</span>
          ${DEMO_PLATE_LIST.map(([k, lbl]) => `<button type="button" data-demo-plate="${k}">${Plate.format(k)}<span>${esc(lbl || DEMO_VEHICLES[k]._hint)}</span></button>`).join('')}
        </div>
      </div>
      <div role="tabpanel" id="${id}-p-manual" aria-labelledby="${id}-t-manual" data-panel="manual"${tab === 'manual' ? '' : ' hidden'}>
        <form class="finder-form finder-form--manual" data-manual-form novalidate>
          <div class="field"><label for="${id}-brand">1. Merk</label>
            <select class="select" id="${id}-brand" name="brand"><option value="">Kies uw merk</option>${brandOpts}</select></div>
          <div class="field"><label for="${id}-model">2. Model / generatie</label>
            <select class="select" id="${id}-model" name="model" disabled aria-describedby="${id}-model-err"><option value="">Kies uw model</option></select>
            <span class="field-error" id="${id}-model-err" data-model-err></span></div>
          <div class="field"><label for="${id}-year">3. Bouwjaar <span class="opt">(optioneel)</span></label>
            <select class="select" id="${id}-year" name="year" disabled><option value="">Onbekend</option></select></div>
          <button class="btn btn--primary" type="submit">${icon('search')} Bekijk mogelijkheden</button>
        </form>
        <div class="finder-foot">Uw model staat er niet bij? <a href="#/contact">Vraag naar de mogelijkheden.</a></div>
      </div>
      <div class="finder-result" data-result aria-live="polite"></div>
    </div>`;
  },

  mount(root, { onDone } = {}) {
    const finder = root.matches && root.matches('[data-finder]') ? root : $('[data-finder]', root);
    if (!finder) return;
    const tabs = $$('[data-tab]', finder);
    const result = $('[data-result]', finder);
    const plateInput = $('input[name="plate"]', finder);
    const plateBox = $('[data-plate-box]', finder);
    const plateErr = $('[data-plate-err]', finder);
    const brandSel = $('select[name="brand"]', finder);
    const modelSel = $('select[name="model"]', finder);
    const yearSel = $('select[name="year"]', finder);
    const modelErr = $('[data-model-err]', finder);
    let busy = false;

    const selectTab = (name, focus = false) => {
      tabs.forEach((t) => {
        const on = t.dataset.tab === name;
        t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1;
        $(`[data-panel="${t.dataset.tab}"]`, finder).hidden = !on;
        if (on && focus) t.focus();
      });
    };
    tabs.forEach((t) => t.addEventListener('click', () => { selectTab(t.dataset.tab); result.innerHTML = ''; }));
    $('[role="tablist"]', finder).addEventListener('keydown', (e) => {
      if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
      const cur = tabs.findIndex((t) => t.getAttribute('aria-selected') === 'true');
      selectTab(tabs[(cur + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length].dataset.tab, true);
    });

    // Prefill manual selects with the current vehicle
    const fillModels = () => {
      const b = brandSel.value;
      modelSel.innerHTML = `<option value="">Kies uw model</option>${MODELS.filter((m) => m.brand === b).map((m) => `<option value="${m.id}">${esc(m.name)} (${modelYears(m)})</option>`).join('')}`;
      modelSel.disabled = !b;
      fillYears();
    };
    const fillYears = () => {
      const m = MODEL[modelSel.value];
      const nowY = new Date().getFullYear();
      yearSel.innerHTML = '<option value="">Onbekend</option>' + (m ? Array.from({ length: Math.min(m.to || nowY, nowY) - m.from + 1 }, (_, i) => (m.to ? Math.min(m.to, nowY) : nowY) - i).map((y) => `<option value="${y}">${y}</option>`).join('') : '');
      yearSel.disabled = !m;
    };
    brandSel.addEventListener('change', () => { fillModels(); modelErr.textContent = ''; modelSel.removeAttribute('aria-invalid'); });
    modelSel.addEventListener('change', () => { fillYears(); modelErr.textContent = ''; modelSel.removeAttribute('aria-invalid'); });
    const cur = VehicleStore.get();
    if (cur) {
      brandSel.value = cur.brandId; fillModels();
      if (cur.modelId) { modelSel.value = cur.modelId; fillYears(); }
      if (cur.year) yearSel.value = String(cur.year);
    }

    $('[data-manual-form]', finder).addEventListener('submit', (e) => {
      e.preventDefault();
      if (!brandSel.value) { brandSel.focus(); brandSel.setAttribute('aria-invalid', 'true'); modelErr.textContent = 'Kies eerst uw merk.'; return; }
      brandSel.removeAttribute('aria-invalid');
      if (!modelSel.value) { modelSel.setAttribute('aria-invalid', 'true'); modelErr.textContent = 'Kies uw model of generatie.'; modelSel.focus(); return; }
      const v = VehicleStore.set({ brandId: brandSel.value, modelId: modelSel.value, year: yearSel.value ? Number(yearSel.value) : null, source: 'manual', confidence: 'manual' });
      if (onDone) onDone(v, { via: 'manual' });
    });

    // Plate input: normalise as the user types
    plateInput.addEventListener('input', () => {
      const raw = plateInput.value;
      const formatted = Plate.format(raw);
      const compact = Plate.compact(raw);
      plateInput.value = formatted || compact.slice(0, 8);
      plateBox.classList.remove('is-invalid'); plateErr.textContent = '';
      plateInput.removeAttribute('aria-invalid');
    });
    const curPlate = VehicleStore.plate();
    if (curPlate) plateInput.value = curPlate;

    const demoToggle = $('[data-demo-toggle]', finder);
    const demoList = $('[data-demo-list]', finder);
    const showDemo = (on) => { demoList.hidden = !on; demoToggle.setAttribute('aria-expanded', String(on)); };
    demoToggle.addEventListener('click', () => showDemo(demoList.hidden));
    demoList.addEventListener('click', (e) => {
      const b = e.target.closest('[data-demo-plate]'); if (!b) return;
      plateInput.value = Plate.format(b.dataset.demoPlate);
      $('[data-plate-form]', finder).requestSubmit ? $('[data-plate-form]', finder).requestSubmit() : $('[data-plate-submit]', finder).click();
    });

    const runLookup = async () => {
      if (busy) return;
      const value = plateInput.value;
      if (!Plate.isValid(value)) {
        plateBox.classList.add('is-invalid'); plateInput.setAttribute('aria-invalid', 'true');
        plateErr.textContent = value.trim() ? 'Dit is geen geldig Nederlands kenteken. Bijvoorbeeld: AB-123-C of 12-AB-34.' : 'Vul uw kenteken in.';
        plateInput.focus();
        return;
      }
      busy = true;
      const submit = $('[data-plate-submit]', finder);
      submit.classList.add('is-loading'); submit.setAttribute('aria-busy', 'true');
      result.innerHTML = `<div class="state-card"><div class="loading-dot" aria-hidden="true"></div>
        <div><div class="sc-kicker" style="color:var(--muted)">Voertuig zoeken</div><div class="sc-title" style="font-size:16px">${plateChip(Plate.format(value))}</div>
        <div class="mt-8" style="display:grid;gap:8px;max-width:320px"><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:55%"></div></div></div></div>`;
      const res = await VehicleLookup.lookup(value);
      busy = false;
      submit.classList.remove('is-loading'); submit.removeAttribute('aria-busy');
      if (res.status === 'invalid') { result.innerHTML = ''; plateBox.classList.add('is-invalid'); plateErr.textContent = 'Dit is geen geldig Nederlands kenteken.'; return; }
      this.renderResult(finder, res, { onDone, selectTab, showDemo, retry: runLookup });
    };
    $('[data-plate-form]', finder).addEventListener('submit', (e) => { e.preventDefault(); runLookup(); });
  },

  renderResult(finder, res, { onDone, selectTab, showDemo, retry }) {
    const result = $('[data-result]', finder);
    const srcTag = res.source === 'demo'
      ? `<span class="demo-flag">${icon('info')} Demo-gegevens</span>`
      : `<span class="source-tag">${icon('check')} Bron: RDW Open Data</span>`;
    const rdwTitle = `${titleCase(res.rdwBrand)} ${titleCase(res.rdwName)}`.trim();
    const contactBtns = `<a class="btn btn--dark btn--sm" href="#/contact">Contact opnemen</a>
      <a class="btn btn--whatsapp btn--sm" href="${WhatsApp.url(WhatsApp.enquiry({ vehicle: rdwTitle || 'onbekend', plate: res.plate, year: res.year, question: 'Welke mogelijkheden zijn er voor mijn auto?' }))}" target="_blank" rel="noopener" data-action="whatsapp">${icon('whatsapp')} WhatsApp</a>`;
    const manualBtn = '<button class="btn btn--light btn--sm" type="button" data-r="manual">Kies een andere auto</button>';
    let html = '';
    const card = (variant, ic, kicker, title, body, actions, extra = '') => `<div class="state-card state-card--${variant}" data-state>
      <div class="sc-icon">${icon(ic)}</div>
      <div><div class="sc-kicker">${kicker}</div><div class="sc-title">${title}</div>${body}</div>
      <div class="sc-actions">${actions}</div>${extra}</div>`;

    const matched = (modelId, confidence) => {
      const v = VehicleStore.set({ brandId: res.brandId, modelId, year: res.year, body: res.body, source: res.source, confidence, rdwName: res.rdwName }, { plate: res.plate });
      const n = Compat.forVehicle(v).length;
      const m = MODEL[modelId];
      const note = { year: `Generatie (${m.name}) bepaald op basis van het bouwjaar.`, user: 'Generatie door u gekozen.', unverified: `Let op: de generatie (${m.name}) kon niet met zekerheid worden bepaald. Klopt dit niet? Kies uw auto handmatig.` }[confidence] || '';
      result.innerHTML = card('ok', 'check', 'Voertuig gevonden', esc(VehicleStore.name(v)),
        `<div class="sc-meta">${plateChip(res.plate)}<span>${esc(VehicleStore.meta(v))}</span>${srcTag}</div>`,
        `<a class="btn btn--primary btn--sm" href="#/mogelijkheden" data-r="done">Bekijk mogelijkheden${n ? ` (${n})` : ''}</a>${manualBtn.replace('Kies een andere auto', 'Wijzig')}`,
        `<p class="sc-note">${note ? `${esc(note)} ` : ''}${esc(Compat.disclaimer)}</p>`);
      Motion.vehicleFound($('[data-state]', result));
      announce(`Voertuig gevonden: ${VehicleStore.name(v)}`);
      $('[data-r="done"]', result).addEventListener('click', (e) => { if (onDone) { e.preventDefault(); onDone(v, { via: 'plate' }); } });
    };

    switch (res.status) {
      case 'matched': matched(res.modelId, res.confidence); break;
      case 'ambiguous':
        html = card('warn', 'info', 'Generatie kiezen', `${esc(BRAND[res.brandId].name)} ${esc(MODEL[res.options[0]].base)} · ${res.year}`,
          `<p class="sc-text">Het bouwjaar valt in de overgang tussen twee generaties. Kies de juiste generatie:</p>`,
          '', `<div class="sc-options">${res.options.map((id) => `<button class="chip" type="button" data-gen="${id}">${esc(MODEL[id].name)} <span class="n">${modelYears(MODEL[id])}</span></button>`).join('')}</div>
          <p class="sc-note">${plateChip(res.plate)} ${srcTag}</p>`);
        break;
      case 'generation_unknown':
        html = card('warn', 'info', 'Generatie niet in online catalogus', `${esc(BRAND[res.brandId].name)} ${esc(res.baseName)}${res.year ? ` · ${res.year}` : ''}`,
          `<p class="sc-text">Voor deze generatie hebben we momenteel geen online mogelijkheden. Neem contact op — CarTronic bekijkt graag wat er mogelijk is.</p><div class="sc-meta">${plateChip(res.plate)}${srcTag}</div>`,
          contactBtns + manualBtn);
        break;
      case 'unknown_model':
        html = card('warn', 'info', 'Model niet in online catalogus', esc(rdwTitle || BRAND[res.brandId].name) + (res.year ? ` · ${res.year}` : ''),
          `<p class="sc-text">Voor dit voertuig hebben we momenteel geen online mogelijkheden beschikbaar.</p><div class="sc-meta">${plateChip(res.plate)}${srcTag}</div>`,
          contactBtns + manualBtn);
        break;
      case 'unsupported_brand':
        html = card('warn', 'info', 'Merk niet ondersteund', esc(rdwTitle) + (res.year ? ` · ${res.year}` : ''),
          `<p class="sc-text">CarTronic is gespecialiseerd in Volkswagen, Audi, SEAT en Škoda. Voor dit voertuig hebben we momenteel geen online mogelijkheden beschikbaar.</p><div class="sc-meta">${plateChip(res.plate)}${srcTag}</div>`,
          '<a class="btn btn--dark btn--sm" href="#/contact">Contact opnemen</a>' + manualBtn);
        break;
      case 'unsupported_kind':
        html = card('warn', 'info', 'Voertuigsoort niet ondersteund', esc(rdwTitle || res.plate),
          `<p class="sc-text">Dit kenteken hoort bij een ${esc(String(res.kind || '').toLowerCase())}. Onze online catalogus richt zich op personen- en bedrijfsauto’s.</p>`,
          '<a class="btn btn--dark btn--sm" href="#/contact">Contact opnemen</a>' + manualBtn);
        break;
      case 'not_found':
        html = card('error', 'alertCircle', 'Kenteken niet gevonden', plateChip(res.plate),
          `<p class="sc-text">Bij dit kenteken vonden we geen voertuig${res.source === 'demo' ? ' (demo)' : ' in de RDW-gegevens'}. Controleer het kenteken of kies uw auto handmatig.</p>`,
          '<button class="btn btn--dark btn--sm" type="button" data-r="edit">Kenteken aanpassen</button><button class="btn btn--light btn--sm" type="button" data-r="manual">Handmatig selecteren</button>');
        break;
      default: // unavailable
        html = card('warn', 'alert', 'RDW tijdelijk niet bereikbaar', 'Voertuiggegevens konden niet worden opgehaald',
          '<p class="sc-text">De RDW-gegevens zijn op dit moment niet bereikbaar. Probeer het opnieuw, kies uw auto handmatig of gebruik een demo-kenteken om de werking te bekijken.</p>',
          '<button class="btn btn--dark btn--sm" type="button" data-r="retry">Opnieuw proberen</button><button class="btn btn--light btn--sm" type="button" data-r="manual">Handmatig selecteren</button><button class="btn btn--ghost btn--sm" type="button" data-r="demo">Demo-kentekens</button>');
    }
    if (html) { result.innerHTML = html; Motion.vehicleFound($('[data-state]', result)); }
    result.onclick = (e) => {
      const g = e.target.closest('[data-gen]');
      if (g) { matched(g.dataset.gen, 'user'); return; }
      const r = e.target.closest('[data-r]'); if (!r) return;
      const act = r.dataset.r;
      if (act === 'manual') { e.preventDefault(); result.innerHTML = ''; selectTab('manual', true); }
      if (act === 'edit') { result.innerHTML = ''; const inp = $('input[name="plate"]', finder); inp.focus(); inp.select(); }
      if (act === 'retry') retry();

/* ---------- Search overlay with autocomplete ---------- */
const SearchOverlay = {
  open(initial = '') {
    const id = uid('sr');
    const v = VehicleStore.get();
    const suggestions = ['Achteruitrijcamera', 'CarPlay', 'ACC kalibratie', 'Virtual Cockpit', 'Trekhaak', 'Inklapbare spiegels', 'Parkeersensoren'];
    Overlay.open({
      kind: 'raw', className: 'search-panel', labelledBy: `${id}_label`,
      body: `<h2 class="sr-only" id="${id}_label">Zoeken</h2>
        <div class="search-field">${icon('search')}
          <input type="text" role="combobox" aria-expanded="false" aria-controls="${id}_list" aria-autocomplete="list" aria-label="Zoek opties, diensten, producten of projecten" placeholder="Zoek op optie, model, dienst of product…" autocomplete="off" spellcheck="false" value="${attr(initial)}">
          <span class="kbd-hint"><button class="kbd" type="button" data-close aria-label="Sluiten">Esc</button></span>
        </div>
        <div class="search-results" id="${id}_list" role="listbox" aria-label="Zoekresultaten"></div>
        <div class="search-foot"><span class="keys"><span><span class="kbd">↑</span> <span class="kbd">↓</span> navigeren</span><span><span class="kbd">Enter</span> openen</span></span><a href="#/zoeken" data-all class="text-link">Alle resultaten</a></div>`,
      initialFocus: 'input',
      onMount(panel, close) {
        const input = $('input', panel); const list = $(`#${id}_list`, panel); const all = $('[data-all]', panel);
        let active = -1; let results = [];
        const setActive = (i) => {
          const opts = $$('[role="option"]', list);
          active = opts.length ? (i + opts.length) % opts.length : -1;
          opts.forEach((o, k) => o.setAttribute('aria-selected', String(k === active)));
          if (active > -1) { input.setAttribute('aria-activedescendant', opts[active].id); opts[active].scrollIntoView({ block: 'nearest' }); } else input.removeAttribute('aria-activedescendant');
        };
        const renderEmpty = () => {
          list.innerHTML = `<div class="search-suggest"><div class="search-group-label" style="padding:0 0 4px">Veelgezocht</div>
            <div class="chips">${suggestions.map((s) => `<button class="chip" type="button" data-suggest="${attr(s)}">${esc(s)}</button>`).join('')}
            ${v ? `<a class="chip" href="#/mogelijkheden">${icon('car')} Opties voor uw ${esc(VehicleStore.short(v))}</a>` : ''}</div></div>`;
          input.setAttribute('aria-expanded', 'false');
          all.href = '#/zoeken';
        };
        const run = () => {
          const q = input.value.trim();
          all.href = `#/zoeken?q=${encodeURIComponent(q)}`;
          if (q.length < 2) { results = []; renderEmpty(); return; }
          results = Search.query(q, { limit: 9, perType: 3 });
          input.setAttribute('aria-expanded', String(results.length > 0));
          if (!results.length) {
            list.innerHTML = `<div class="search-empty">Geen resultaten voor “${esc(q)}”.<br><span class="text-small">Probeer een andere term, of <a class="text-link" href="#/contact">vraag het ons</a>.</span></div>`;
            active = -1; return;
          }
          const groups = Search.TYPE_ORDER.map((t) => [t, results.filter((r) => r.type === t)]).filter(([, r]) => r.length);
          let n = 0;
          list.innerHTML = groups.map(([t, rs]) => `<div class="search-group" role="group" aria-label="${Search.TYPE_LABEL[t]}">
            ${rs.map((r) => `<a class="search-option" role="option" id="${id}_o${n++}" href="${attr(r.href)}" aria-selected="false">
              <span class="so-type" data-type="${r.type}">${Search.TYPE_LABEL[r.type]}</span>
              <span><span class="so-title">${Search.highlight(r.title, q)}</span><span class="so-sub" style="display:block">${esc(r.sub || '')}</span></span>
              ${icon('arrow', 'so-go')}</a>`).join('')}</div>`).join('');
          setActive(0);
        };
        const debounced = debounce(run, 90);
        input.addEventListener('input', debounced);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
          else if (e.key === 'Enter') {
            e.preventDefault();
            const opts = $$('[role="option"]', list);
            if (active > -1 && opts[active]) { close(); location.hash = opts[active].getAttribute('href'); }
            else if (input.value.trim().length >= 2) { close(); Router.go('/zoeken', { q: input.value.trim() }); }
          }
        });
        list.addEventListener('click', (e) => {
          const s = e.target.closest('[data-suggest]');
          if (s) { input.value = s.dataset.suggest; run(); input.focus(); return; }
          if (e.target.closest('a')) close();
        });
        list.addEventListener('mousemove', (e) => {
          const o = e.target.closest('[role="option"]'); if (!o) return;
          const idx = $$('[role="option"]', list).indexOf(o); if (idx !== active) setActive(idx);
        });
        all.addEventListener('click', () => close());
        run();
      },
    });
  },
};

  linesHtml(lines) {

    return `<div class="cart-lines">${lines.map((l) => `<div class="cart-line" data-line="${l.product.id}">
      <div class="cl-media">${Media.html(l.product.images[0], l.product.name, { kind: productArtKind(l.product) })}</div>
      <div>
        <div class="cl-title"><a href="#/webshop/${l.product.slug}">${esc(l.product.name)}</a></div>
        <div class="cl-meta">${Money.fmt(l.unitPrice)} per stuk${l.pricing.onSale ? ` · <span style="color:var(--red)">−${l.pricing.pct}%</span>` : ''}</div>
        <div class="cl-row">

  },
  totalsHtml(t, { shippingLabel = 'Verzending', shippingKnown = false } = {}) {
    return `<div class="totals">
      ${t.discountTotal ? `<div class="t-row"><span>Subtotaal (normale prijs)</span><span>${Money.fmt(t.subtotalRegular)}</span></div>
      <div class="t-row is-discount"><span>Korting</span><span>−${Money.fmt(t.discountTotal)}</span></div>` : ''}
      <div class="t-row"><span>Subtotaal</span><span>${Money.fmt(t.subtotal)}</span></div>
      <div class="t-row"><span>${esc(shippingLabel)}</span><span>${shippingKnown ? (t.shipping ? Money.fmt(t.shipping) : Money.fmt(0)) : 'Bij afrekenen'}</span></div>
      <div class="t-row is-total"><span>Totaal</span><span>${Money.fmt(t.total)}</span></div>
      ${t.vat.included && Repo.settings().vat.showBreakdown ? `<div class="t-row is-sub"><span>Waarvan btw (${t.vat.rate}%)</span><span>${Money.fmt(t.vat.amount)}</span></div>` : ''}
    </div>`;
  },
  openDrawer({ added = null } = {}) {
    const { notices } = Cart.validate();
    const render = (panel) => {
      const lines = Cart.lines();
      const t = computeTotals(lines, 0);
      $('.drawer-body', panel).innerHTML = `${notices.length ? `<div class="notice-stack mb-16" style="margin-bottom:16px">${notices.map((n) => UI.notice(esc(n), { type: 'warn', ic: 'alert' })).join('')}</div>` : ''}${this.linesHtml(lines)}`;
      const foot = $('.drawer-foot', panel);
      foot.hidden = !lines.length;
      foot.innerHTML = lines.length ? `${this.totalsHtml(t)}<div class="grid mt-16" style="gap:10px">
        <a class="btn btn--primary btn--block" href="#/afrekenen">Afrekenen</a>
        <a class="btn btn--light btn--block" href="#/winkelmand">Bekijk winkelmand</a></div>` : '';
      Behaviours.mount(panel);
    };
    Overlay.open({
      kind: 'drawer', title: `${icon('cart')} Winkelmand`,
      body: '', foot: ' ',
      onMount: (panel, close) => {
        if (added) $('.drawer-head', panel).insertAdjacentHTML('afterend', `<div class="added-banner">${icon('check')} Toegevoegd aan winkelmand</div>`);
        render(panel);
        panel.addEventListener('change', (e) => {
          const q = e.target.closest('[data-qty]'); if (!q) return;
          const r = Cart.setQty(q.dataset.qty, e.target.value);
          if (r.limited) Toast.show('Maximaal beschikbare aantal bereikt.');
          render(panel);
        });
        panel.addEventListener('click', (e) => {
          const rm = e.target.closest('[data-remove]');
          if (rm) { Cart.remove(rm.dataset.remove); render(panel); announce('Product verwijderd uit winkelmand'); return; }
          if (e.target.closest('a[href^="#/"]')) close();
        });
      },
    });
  },
  miniTimer: null,
  showAdded(product, res) {
    if (window.matchMedia('(max-width: 760px)').matches) {
      Toast.show(`${product.name} is toegevoegd aan uw winkelmand.`, { action: { label: 'Bekijk', href: '#/winkelmand' } });
      return;
    }
    let el = $('#miniCart');
    if (!el) {
      el = document.createElement('div');
      el.id = 'miniCart'; el.className = 'mini-cart'; el.setAttribute('role', 'status');
      document.body.appendChild(el);
    }
    const pr = Pricing.calc(product);
    el.innerHTML = `<div class="mc-head">${icon('check')} Toegevoegd aan winkelmand<button class="icon-btn icon-btn--sm" type="button" aria-label="Sluiten" data-mc-close>${icon('x')}</button></div>
      <div class="mc-body"><div class="cart-line" style="padding:0;border:0">
        <div class="cl-media">${Media.html(product.images[0], product.name, { kind: productArtKind(product) })}</div>
        <div><div class="cl-title">${esc(product.name)}</div><div class="cl-meta">${res.qty} × ${Money.fmt(pr.price)}${res.limited ? ' · maximaal beschikbaar' : ''}</div></div></div></div>
      <div class="mc-actions"><a class="btn btn--light btn--sm" href="#/winkelmand">Bekijk winkelmand</a><a class="btn btn--primary btn--sm" href="#/afrekenen">Afrekenen</a></div>`;
    requestAnimationFrame(() => el.classList.add('is-open'));
    const hide = () => el.classList.remove('is-open');
    $('[data-mc-close]', el).onclick = hide;
    $$('a', el).forEach((a) => { a.onclick = hide; });
    clearTimeout(this.miniTimer);
    this.miniTimer = setTimeout(hide, 5000);
    el.onmouseenter = () => clearTimeout(this.miniTimer);
    el.onmouseleave = () => { this.miniTimer = setTimeout(hide, 2500); };
  },
};

/* ---------- Catalog (Mogelijkheden) ---------- */
function catalogState(query) {
  const v = VehicleStore.get();
  const explicit = !!(query.merk || query.model);
  const useVehicle = !explicit && !query.alle && !!v;
  let merk = query.merk || ''; let model = query.model || '';
  if (model && MODEL[model]) merk = MODEL[model].brand;
  if (merk && !BRAND[merk]) merk = '';
  if (model && !MODEL[model]) model = '';
  if (useVehicle) { merk = v.brandId; model = v.modelId || ''; }
  return { v, useVehicle, merk, model, cat: CATEGORY[query.cat] ? query.cat : '', groep: GROUP[query.groep] ? query.groep : '', q: query.q || '' };
}
function catalogResults(s) {
  let textSet = null;
  if (s.q.trim().length >= 2) textSet = new Set(Search.query(s.q, { limit: 999, perType: 0, types: ['RETROFIT'] }).map((r) => r.id));
  let items = RETROFITS.filter((r) => {
    if (s.merk && !Compat.brandsOf(r).includes(s.merk)) return false;
    if (s.model && !(r.models.includes(s.model) || r.scope === 'brand')) return false;
    if (s.cat && r.cat !== s.cat) return false;
    if (s.groep && CATEGORY[r.cat].group !== s.groep) return false;
    if (textSet && !textSet.has(r.slug)) return false;
    return true;
  });
  const catIdx = (r) => CATEGORIES.findIndex((c) => c.id === r.cat);
  if (s.v) {
    const rank = (r) => { const st = Compat.status(r, s.v); return st ? Compat.STATUS[st.key].rank : 9; };
    items = items.slice().sort((a, b) => rank(a) - rank(b) || (s.model ? catIdx(a) - catIdx(b) : 0));
  } else if (s.model) {
    // One model: group its options by category (camera & parkeren first, as in the filters).
    items = items.slice().sort((a, b) => catIdx(a) - catIdx(b));
  }
  return items;
}

/* ---------- Retrofit detail ---------- */
/* Spec rows: standard rows (model, category, warranty, price) merged with the option's own specs. */
function retrofitSpecs(r) {
  const own = new Map(r.specs || []);
  const rows = [];
  const add = (k, val) => { const x = own.has(k) ? own.get(k) : val; own.delete(k); if (x) rows.push([k, x]); };
  add('Model', r.scope === 'brand' ? `Meerdere modellen (${Compat.brandsOf(r).map((b) => BRAND[b].name).join(', ')})`
    : r.models.map((m) => `${modelLabel(m)} (${modelYearsFor(r, m)})`).join(', '));
  add('Geschikt voor', '');
  add('Categorie', CATEGORY[r.cat].name);
  [...own.keys()].filter((k) => !['Garantie', 'Prijs'].includes(k)).forEach((k) => add(k, ''));
  add('Garantie', r.warranty);
  add('Prijs', r.price || 'Op aanvraag');
  add('Aanbieding', r.offer);
  return rows;
}
/* Breadcrumb trail of an option; used for the visible crumbs and the BreadcrumbList. */
function retrofitCrumbs(r) {
  const single = r.models.length === 1 ? r.models[0] : null;
  const crumbs = [['Home', '#/'], ['Mogelijkheden', '#/mogelijkheden']];
  if (r.brand) crumbs.push([BRAND[r.brand].name, `#/mogelijkheden?merk=${r.brand}`]);
  if (single) crumbs.push([MODEL[single].name, `#/mogelijkheden?merk=${r.brand}&model=${single}`]);
  crumbs.push([CATEGORY[r.cat].name, `#/mogelijkheden?${r.brand ? `merk=${r.brand}&` : ''}${single ? `model=${single}&` : ''}cat=${r.cat}`]);
  crumbs.push([r.name]);
  return crumbs;
}
const modelYearsFor = (r, m) => { const y = (r.yearsByModel && r.yearsByModel[m]) || null; return y ? `${y[0]}–${y[1]}` : modelYears(MODEL[m]); };
/* Up to n items, one per category first, so a related row shows different kinds of upgrades. */
function diverseRetrofits(list, n = 3, skipCat = null) {
  const out = []; const seen = new Set(skipCat ? [skipCat] : []);
  list.forEach((x) => { if (out.length < n && !seen.has(x.cat)) { out.push(x); seen.add(x.cat); } });
  list.forEach((x) => { if (out.length < n && !out.includes(x)) out.push(x); });
  return out;
}

    panels.push({ title: 'Afhankelijk van uitvoering?', html: `<p>${esc(r.variantNote || 'Ja. Of deze optie mogelijk is, hangt af van bouwjaar, uitvoering en de systemen die al in uw auto aanwezig zijn.')}</p>${r.years ? `<p class="mt-8">Online vermeld voor bouwjaar ${r.years[0]}–${r.years[1]}.</p>` : ''}` });

    // Related: (1) for the visitor's car, (2) other upgrades for this model, else (3) similar options.
    const sections = [];
    const forCar = v ? Compat.forVehicle(v).map((x) => x.item).filter((x) => x.slug !== r.slug) : [];
    if (forCar.length) sections.push({ id: 'rel-car', title: `Ook interessant voor uw ${VehicleStore.short(v)}`, items: diverseRetrofits(forCar), link: `<a class="link" href="#/mogelijkheden">Alle opties voor uw auto ${icon('arrow')}</a>` });

    if (forModel.length) sections.push({ id: 'rel-model', title: `Andere upgrades voor de ${modelLabel(single)}`, items: diverseRetrofits(forModel, 3, r.cat), link: `<a class="link" href="#/mogelijkheden?merk=${r.brand}&model=${single}">Alle ${catalogResults({ merk: r.brand, model: single, cat: '', groep: '', q: '', v: null }).length} opties ${icon('arrow')}</a>` });

      const similar = RETROFITS.filter((x) => x.slug !== r.slug && x.cat === r.cat && (!brandId || Compat.brandsOf(x).includes(brandId)));
      if (similar.length) sections.push({ id: 'rel-similar', title: 'Vergelijkbare opties', items: diverseRetrofits(similar) });
    }
    const sameFeature = r.feature && r.brand && r.scope !== 'brand'
      ? RETROFITS.filter((x) => x.slug !== r.slug && x.feature === r.feature && x.brand === r.brand && x.scope !== 'brand' && !x.models.every((m) => r.models.includes(m))).slice(0, 12) : [];

    const saved = Saved.has('retrofits', r.slug);
    const waText = WhatsApp.enquiry({ vehicle: v ? VehicleStore.name(v) : (single ? modelLabel(single) : ''), plate: VehicleStore.plate(), year: v ? v.year : null, options: [r.title], question: 'Is deze optie mogelijk voor mijn auto?' });
    const recent = Recent.list({ type: 'retrofit', id: r.slug });
    return `
      <div class="detail-top"><div class="container">${UI.crumbs(crumbs.slice(0), { light: true })}</div></div>
      <div class="container detail-grid">
        <div class="detail-media" data-mask>${Media.html(retrofitImage(r), r.title, { kind: r.art, eager: true })}${r.imageNote ? `<span class="media-note">${esc(r.imageNote)}</span>` : ''}</div>
        <div class="detail-info">
          <p class="eyebrow">${esc(r.brand ? BRAND[r.brand].name : 'Alle merken')} · ${esc(CATEGORY[r.cat].name)}</p>
          <h1>${esc(r.title)}</h1>
          <p class="lead">${esc(r.short)}</p>
          <div class="detail-actions">
            <a class="btn btn--primary" href="#/contact?optie=${r.slug}">Vraag deze optie aan</a>
            <a class="btn btn--whatsapp" href="${WhatsApp.url(waText)}" target="_blank" rel="noopener" data-action="whatsapp">${icon('whatsapp')} WhatsApp</a>
            <button class="btn btn--light" type="button" data-action="toggle-save" data-type="retrofits" data-id="${r.slug}" aria-pressed="${saved}">${icon('bookmark')} <span data-save-label>${saved ? 'Bewaard' : 'Bewaar optie'}</span></button>
          </div>
          <div class="detail-block"><h2>Compatibiliteit</h2>${compat}</div>
          <div class="detail-block"><h2>Voordelen</h2><ul class="benefits">${(copy.benefits || []).map((b) => `<li>${icon('check')}${esc(b)}</li>`).join('')}</ul></div>
          <div class="detail-block"><h2>Specificaties</h2><dl class="spec-list">${retrofitSpecs(r).map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(val)}</dd>`).join('')}</dl>
            ${r.price || r.offer ? '<p class="hint mt-16">Prijs zoals vermeld door CarTronic. De definitieve prijs voor uw uitvoering bevestigen we bij uw aanvraag.</p>' : ''}</div>
          ${sameFeature.length ? `<div class="detail-block"><h2>${esc(r.name)} voor andere ${esc(BRAND[r.brand].name)}-modellen</h2><div class="cp-models">${sameFeature.map((x) => `<a class="pill pill--outline" href="#/mogelijkheden/${x.slug}">${esc(x.models.map((m) => MODEL[m].name).join(', '))}${x.variant && VARIANTS[x.variant].label ? ` ${esc(VARIANTS[x.variant].label)}` : ''}</a>`).join('')}</div></div>` : ''}
          <div class="detail-block"><h2>Technische informatie</h2>${UI.accordion(panels)}</div>
          ${project ? `<div class="detail-block">${UI.notice(`<strong>Uit de werkplaats:</strong> ${esc(project.title)} — ${esc(project.vehicle)}.`, { ic: 'camera', actions: `<a class="btn btn--dark btn--xs" href="#/projecten/${project.slug}">Bekijk het project</a>` })}</div>` : ''}
        </div>
      </div>
      ${sections.map((x, i) => relatedSection({ ...x, v, follows: i > 0 })).join('')}
      ${recent.length ? recentSection(recent) : ''}
      ${ctaBand()}`;
  },
  mount(root) { Behaviours.mount(root); },
};

Pages.projects = {

  meta: { title: 'Projecten — uit de werkplaats', description: 'Originele upgrades en specialistische werkzaamheden, gefotografeerd in de CarTronic-werkplaats in Rijswijk.' },

    return `${UI.pageHeader({ crumbs: [['Uit de werkplaats.']], eyebrow: 'Portfolio', title: 'Uit de werkplaats.', lead: 'Originele upgrades en specialistische werkzaamheden, gefotografeerd in de CarTronic-werkplaats.' })}
      <section class="section" style="padding-top:64px"><div class="container">
        ${list.length > 1 ? `<div class="flex wrap gap-24 items-center" style="margin-bottom:40px" role="group" aria-label="Filter projecten">
          <div class="chips" data-pf="merk"><button class="chip" type="button" data-v="" aria-pressed="${!fb}">Alle merken</button>${brands.map((b) => `<button class="chip" type="button" data-v="${b.id}" aria-pressed="${fb === b.id}">${b.name}</button>`).join('')}</div>
          <div class="chips" data-pf="type"><button class="chip" type="button" data-v="" aria-pressed="${!ft}">Alle types</button>${types.map((t) => `<button class="chip" type="button" data-v="${t.id}" aria-pressed="${ft === t.id}">${esc(t.name)}</button>`).join('')}</div>
        </div>` : ''}
        <h2 class="sr-only">Projecten</h2>
        <div class="grid grid-3" data-project-grid>${list.map((p) => UI.projectCard(p)).join('')}</div>
        <div data-project-empty hidden>${UI.empty({ icon: 'camera', title: 'Geen projecten voor deze selectie', text: 'Kies een ander merk of type.', actions: '<button class="btn btn--dark btn--sm" type="button" data-pf-reset>Toon alle projecten</button>' })}</div>
      </div></section>
      ${ctaBand({ title: 'Ook uw auto een originele upgrade?', text: 'Bekijk de mogelijkheden voor uw model of stuur ons uw kenteken.' })}`;
  },
  mount(root, ctx) {
    const state = { merk: ctx.query.merk || '', type: ctx.query.type || '' };
    const grid = $('[data-project-grid]', root); const empty = $('[data-project-empty]', root);
    const apply = (animate = true) => {
      let shown = 0;
      $$('.project-card', grid).forEach((c) => {
        const ok = (!state.merk || c.dataset.brands.split(' ').includes(state.merk)) && (!state.type || c.dataset.type === state.type);
        c.hidden = !ok; if (ok) shown++;
      });
      empty.hidden = shown > 0;
      $$('[data-pf]', root).forEach((g) => $$('.chip', g).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === state[g.dataset.pf]))));
      Router.setQuery(Object.fromEntries(Object.entries(state).filter(([, x]) => x)));
      if (animate) Motion.swap(grid, '.project-card:not([hidden])');
      announce(`${shown} ${shown === 1 ? 'project' : 'projecten'}`);
    };
    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-pf] .chip');
      if (b) { state[b.closest('[data-pf]').dataset.pf] = b.dataset.v; apply(); }
      if (e.target.closest('[data-pf-reset]')) { state.merk = ''; state.type = ''; apply(); }
    });
    apply(false);
  },
};

Pages.contact = {

  meta: { title: 'Contact — vraag naar de mogelijkheden', description: 'Neem contact op met CarTronic in Rijswijk: Patrijsweg 22, 070 383 9836, info@cartronic.nl. Stuur uw kenteken en gewenste optie via WhatsApp of e-mail.' },
  render() {
    return `${UI.pageHeader({ crumbs: [['Contact']], eyebrow: 'Contact', title: 'Vraag naar de mogelijkheden.', lead: 'Stuur uw kenteken en de gewenste optie. CarTronic controleert wat er mogelijk is voor uw uitvoering.' })}
      <section class="section section--sm" style="padding-top:56px"><div class="container contact-grid">
        <form class="contact-form" data-contact novalidate>
          <div data-contact-body></div>
        </form>
        <aside class="contact-card on-dark" aria-label="Contactgegevens">
          <h2>CarTronic</h2>
          <dl>
            <div><dt>Adres</dt><dd>${COMPANY.street}<br>${COMPANY.postal} ${COMPANY.city}</dd></div>
            <div><dt>Telefoon</dt><dd><a href="${COMPANY.phoneHref}">${COMPANY.phoneDisplay}</a></dd></div>
            <div><dt>WhatsApp</dt><dd><a href="${WhatsApp.generic()}" target="_blank" rel="noopener" data-action="whatsapp" data-wa-generic>${COMPANY.phoneDisplay}</a></dd></div>
            <div><dt>E-mail</dt><dd><a href="mailto:${COMPANY.email}">${COMPANY.email}</a></dd></div>
            <div><dt>Openingstijden</dt><dd><dl class="footer-hours">${COMPANY.hours.map(([d, t]) => `<dt>${d}</dt><dd>${t}</dd>`).join('')}</dl></dd></div>
          </dl>
          <div class="cc-actions">
            <a class="btn btn--outline-light btn--sm" href="${COMPANY.mapsUrl}" target="_blank" rel="noopener">${icon('pin')} Route plannen</a>
          </div>
        </aside>
      </div></section>`;
  },
  mount(root, ctx) {
    const v = VehicleStore.get();
    const draft = Storage.get('contactDraft', {}, 'session');
    const optionSlugs = uniq([ctx.query.optie, ...(draft.options || []), ...Saved.all().retrofits].filter((s) => s && RETROFIT[s]));
    const productIds = uniq([...(draft.products || []), ...Cart.get().items.map((i) => i.productId), ...Saved.all().products].filter((id) => isPublicProduct(Repo.product(id))));
    const state = {
      name: draft.name || '', email: draft.email || '', phone: draft.phone || '',
      vehicle: draft.vehicle || (v ? VehicleStore.name(v) : ''), plate: draft.plate || VehicleStore.plate() || '', year: draft.year || (v && v.year ? String(v.year) : ''),
      options: optionSlugs, products: productIds, question: draft.question || '',
    };
    const body = $('[data-contact-body]', root);
    const err = {};
    const summary = () => WhatsApp.enquiry({
      name: state.name, vehicle: state.vehicle, plate: Plate.format(state.plate) || state.plate, year: state.year,
      options: state.options.map((s) => RETROFIT[s].title), products: state.products.map((id) => Repo.product(id)).filter(Boolean).map((p) => `${p.name} (${p.sku})`), question: state.question,
    });
    const save = () => Storage.set('contactDraft', { ...state }, 'session');
    const render = () => {
      body.innerHTML = `
        <div class="form-section"><h2>Uw auto</h2>
          <div class="form-grid">
            <div class="field span-2"><label for="c-vehicle">Merk en model</label><input class="input" id="c-vehicle" data-k="vehicle" value="${attr(state.vehicle)}" placeholder="Bijv. Volkswagen Golf 8"></div>
            <div class="field"><label for="c-plate">Kenteken <span class="opt">(optioneel)</span></label><input class="input" id="c-plate" data-k="plate" value="${attr(state.plate)}" placeholder="AB-123-C" autocapitalize="characters" aria-describedby="c-plate-e"><span class="field-error" id="c-plate-e">${err.plate || ''}</span></div>
            <div class="field"><label for="c-year">Bouwjaar <span class="opt">(optioneel)</span></label><input class="input" id="c-year" data-k="year" inputmode="numeric" maxlength="4" value="${attr(state.year)}" placeholder="2019"></div>
          </div>
          ${v ? '' : `<p class="hint mt-8">Tip: <button type="button" class="text-link" data-action="open-vehicle">zoek uw auto op kenteken</button> om dit automatisch in te vullen.</p>`}
        </div>
        <div class="form-section"><h2>Geselecteerde opties</h2>
          <div class="chips" data-opt-list>${state.options.length ? state.options.map((s) => `<span class="chip chip--removable">${esc(RETROFIT[s].title)}<button type="button" data-rm-opt="${s}" aria-label="Verwijder ${attr(RETROFIT[s].title)}">${icon('x')}</button></span>`).join('') : '<span class="hint">Nog geen opties geselecteerd. Bewaar opties in de catalogus of voeg er hieronder een toe.</span>'}</div>
          <div class="field mt-16"><label for="c-addopt">Optie toevoegen</label><select class="select" id="c-addopt" data-add-opt><option value="">Kies een optie…</option>${(v ? Compat.forVehicle(v).map((x) => x.item) : RETROFITS).filter((r) => !state.options.includes(r.slug)).map((r) => `<option value="${r.slug}">${esc(r.title)}</option>`).join('')}</select></div>
          ${state.products.length ? `<div class="mt-16"><p class="label" style="margin-bottom:8px">Producten uit de webshop</p><div class="chips">${state.products.map((id) => { const p = Repo.product(id); return `<span class="chip chip--removable">${esc(p.name)}<button type="button" data-rm-prod="${id}" aria-label="Verwijder ${attr(p.name)}">${icon('x')}</button></span>`; }).join('')}</div></div>` : ''}
        </div>
        <div class="form-section"><h2>Uw vraag</h2>
          <div class="field"><label for="c-q">Vraag of opmerking</label><textarea class="textarea" id="c-q" data-k="question" placeholder="Bijv. welke uitvoering heb ik nodig, of wanneer kan ik langskomen?" aria-describedby="c-q-e">${esc(state.question)}</textarea><span class="field-error" id="c-q-e">${err.question || ''}</span></div>
        </div>
        <div class="form-section"><h2>Uw gegevens</h2>
          <div class="form-grid">
            <div class="field span-2"><label for="c-name">Naam</label><input class="input" id="c-name" data-k="name" autocomplete="name" value="${attr(state.name)}" aria-describedby="c-name-e"${err.name ? ' aria-invalid="true"' : ''}><span class="field-error" id="c-name-e">${err.name || ''}</span></div>
            <div class="field"><label for="c-email">E-mail <span class="opt">(optioneel)</span></label><input class="input" id="c-email" type="email" data-k="email" autocomplete="email" value="${attr(state.email)}" aria-describedby="c-email-e"${err.email ? ' aria-invalid="true"' : ''}><span class="field-error" id="c-email-e">${err.email || ''}</span></div>
            <div class="field"><label for="c-phone">Telefoon <span class="opt">(optioneel)</span></label><input class="input" id="c-phone" type="tel" data-k="phone" autocomplete="tel" value="${attr(state.phone)}" aria-describedby="c-phone-e"${err.phone ? ' aria-invalid="true"' : ''}><span class="field-error" id="c-phone-e">${err.phone || ''}</span></div>
          </div>
        </div>
        <div class="form-section"><h2>Samenvatting van uw aanvraag</h2>
          <div class="enquiry-summary"><pre data-summary>${esc(summary())}</pre></div>
          <div class="detail-actions">
            <button class="btn btn--whatsapp" type="button" data-send="whatsapp">${icon('whatsapp')} Verstuur via WhatsApp</button>
            <button class="btn btn--dark" type="button" data-send="email">${icon('mail')} Verstuur per e-mail</button>
          </div>
          <p class="hint mt-16">Dit formulier verstuurt zelf geen gegevens: uw aanvraag opent in WhatsApp of uw e-mailprogramma, zodat u alles nog kunt controleren. Uw invoer wordt tijdelijk bewaard in deze browsersessie.</p>
        </div>`;
    };
    const validate = () => {
      Object.keys(err).forEach((k) => delete err[k]);
      if (!state.name.trim()) err.name = 'Vul uw naam in.';
      if (state.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(state.email)) err.email = 'Vul een geldig e-mailadres in.';
      if (state.phone && !/^(\+|0)[0-9\s-]{8,15}$/.test(state.phone.trim())) err.phone = 'Vul een geldig telefoonnummer in.';
      if (state.plate && !Plate.isValid(state.plate)) err.plate = 'Dit is geen geldig Nederlands kenteken.';
      if (!state.question.trim() && !state.options.length && !state.products.length) err.question = 'Stel uw vraag of selecteer ten minste één optie.';
      return !Object.keys(err).length;
    };
    render();
    body.addEventListener('input', (e) => {
      const k = e.target.dataset.k; if (!k) return;
      state[k] = e.target.value;
      if (k === 'plate') { const f = Plate.format(e.target.value); if (f) { state.plate = f; } }
      $('[data-summary]', body).textContent = summary();
      save();
    });
    body.addEventListener('change', (e) => {
      if (e.target.matches('[data-add-opt]') && e.target.value) { state.options.push(e.target.value); save(); render(); $('[data-add-opt]', body).focus(); }
      if (e.target.dataset.k === 'plate') { const f = Plate.format(state.plate); if (f) e.target.value = f; }
    });
    body.addEventListener('click', (e) => {
      const ro = e.target.closest('[data-rm-opt]'); if (ro) { state.options = state.options.filter((s) => s !== ro.dataset.rmOpt); save(); render(); return; }
      const rp = e.target.closest('[data-rm-prod]'); if (rp) { state.products = state.products.filter((s) => s !== rp.dataset.rmProd); save(); render(); return; }
      const send = e.target.closest('[data-send]'); if (!send) return;
      if (!validate()) {
        render();
        const first = $('[aria-invalid="true"], .field-error:not(:empty)', body);
        const target = first && first.classList.contains('field-error') ? first.previousElementSibling : first;
        if (target) target.focus();
        Toast.show('Controleer de gemarkeerde velden.', { error: true });
        return;
      }
      const text = summary();
      if (send.dataset.send === 'whatsapp') {
        Analytics.track('whatsapp_clicked', { context: 'contact' });
        window.open(WhatsApp.url(text), '_blank', 'noopener');
      } else {
        Analytics.track('enquiry_email_opened', {});
        const subject = `Aanvraag via website${state.vehicle ? ` — ${state.vehicle}` : ''}`;
        location.href = `mailto:${COMPANY.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
      }
      Toast.show('Uw aanvraag is klaargezet. Controleer en verstuur het bericht.');
    });
  },
};

const shopNotice = () => `<div class="shop-notice"><div class="container">${icon('info')}<span><strong>Testomgeving.</strong> Producten en prijzen in deze webshop zijn demonstratiegegevens; betalingen worden gesimuleerd.</span></div></div>`;

function shopState(query) {
  return {
    cat: query.cat || '', merk: query.merk || '', model: query.model || '',
    min: query.min || '', max: query.max || '', stock: query.stock === '1', featured: query.featured === '1',
    sort: query.sort || 'aanbevolen',
  };
}
function shopFilter(products, s) {
  const min = s.min !== '' ? Money.parse(s.min) : NaN; const max = s.max !== '' ? Money.parse(s.max) : NaN;
  let list = products.filter((p) => {
    const c = p.compatibility || {};
    if (s.cat && p.category !== s.cat) return false;
    if (s.merk && (c.brands || []).length && !c.brands.includes(s.merk)) return false;
    if (s.model && !(c.models || []).includes(s.model)) return false;
    const price = Pricing.calc(p).price;
    if (Number.isFinite(min) && price < min) return false;
    if (Number.isFinite(max) && price > max) return false;
    if (s.stock && Stock.status(p).key === 'out') return false;
    if (s.featured && !p.featured) return false;
    return true;
  });
  const price = (p) => Pricing.calc(p).price;
  const sorters = {
    aanbevolen: (a, b) => (b.featured - a.featured) || ((Stock.status(a).key === 'out') - (Stock.status(b).key === 'out')) || a.name.localeCompare(b.name, 'nl'),
    'prijs-op': (a, b) => price(a) - price(b),
    'prijs-af': (a, b) => price(b) - price(a),
    nieuw: (a, b) => String(b.createdAt).localeCompare(String(a.createdAt)),
  };
  list = list.slice().sort(sorters[s.sort] || sorters.aanbevolen);
  return list;
}

        ${anyFeatured ? `<label class="check"><input type="checkbox" data-f="featured"${s.featured ? ' checked' : ''}><span class="box">${icon('check')}</span>Alleen uitgelicht</label>` : ''}

      const list = shopFilter(all, s);
      countEl.innerHTML = `<strong>${list.length}</strong> ${list.length === 1 ? 'product' : 'producten'}`;
      grid.innerHTML = list.length ? list.map((p) => UI.productCard(p)).join('')
        : UI.empty({ icon: 'box', title: all.length ? 'Geen producten gevonden' : 'Er zijn momenteel geen producten', text: all.length ? 'Pas uw filters aan om meer producten te zien.' : 'Bekijk in de tussentijd de mogelijkheden voor uw auto.', actions: all.length ? '<button class="btn btn--dark btn--sm" type="button" data-action="reset-filters">Filters wissen</button>' : '<a class="btn btn--dark btn--sm" href="#/mogelijkheden">Mogelijkheden</a>' });

    const onChange = (e) => {
      const f = e.target.dataset.f; if (!f) return;
      if (f === 'stock' || f === 'featured') s[f] = e.target.checked;
      else if (f === 'min' || f === 'max') {
        const raw = e.target.value.trim();
        const ok = raw === '' || Number.isFinite(Money.parse(raw));
        e.target.setAttribute('aria-invalid', String(!ok));
        if (!ok) return;
        s[f] = raw;
      } else s[f] = e.target.value;
      sync(); update();
    };
    filtersEl.addEventListener('change', onChange);
    filtersEl.addEventListener('input', debounce((e) => { if (['min', 'max'].includes(e.target.dataset.f)) onChange(e); }, 350));
    $('[data-sort]', root).addEventListener('change', (e) => { s.sort = e.target.value; sync(); update(); });
    root.addEventListener('click', (e) => {
      if (e.target.closest('[data-action="reset-filters"]')) {
        s = shopState({});
        filtersEl.innerHTML = this.filtersHtml(s, all);
        $('[data-sort]', root).value = 'aanbevolen';
        sync(); update();
      }
      if (e.target.closest('[data-action="open-filters"]')) openFiltersDrawer(filtersEl, $('[data-filters-home]', root));
    });
    update(false);
  },
};

/* ---------- Checkout ---------- */
Pages.checkout = {
  id: 'checkout', nav: 'webshop', mobileBar: false,
  meta: { title: 'Afrekenen' },
  render() {
    return `<div class="detail-top" style="border-bottom:1px solid var(--line);padding-bottom:22px"><div class="container flex justify-between items-center wrap gap-16">
        ${UI.crumbs([['Home', '#/'], ['Winkelmand', '#/winkelmand'], ['Afrekenen']], { light: true })}
        <ol class="checkout-steps" aria-label="Stappen"><li class="is-active"><span class="n">1</span>Gegevens</li><li><span class="n">2</span>Betalen</li><li><span class="n">3</span>Bevestiging</li></ol>
      </div></div>
      ${shopNotice()}
      <div class="container" data-checkout-root></div>`;
  },
  mount(root) {
    const host = $('[data-checkout-root]', root);
    const settings = Repo.settings();
    const methods = settings.shipping.filter((m) => m.enabled);
    const draft = Storage.get('checkoutForm', {}, 'session');
    const form = {
      firstName: '', lastName: '', email: '', phone: '', street: '', houseNumber: '', postal: '', city: '', note: '',
      delivery: (methods[0] || {}).id || '', ...draft,
    };
    if (!methods.find((m) => m.id === form.delivery)) form.delivery = (methods[0] || {}).id || '';
    let errors = {}; let notices = Cart.validate().notices; let busy = false;
    Analytics.track('checkout_started', { items: Cart.count() });
    const field = (k, label, opts = {}) => `<div class="field${opts.span ? ' span-2' : ''}"><label for="co-${k}">${label}${opts.optional ? ' <span class="opt">(optioneel)</span>' : ''}</label>
      <input class="input" id="co-${k}" name="${k}" data-k="${k}" type="${opts.type || 'text'}" autocomplete="${opts.ac || 'off'}"${opts.mode ? ` inputmode="${opts.mode}"` : ''} value="${attr(form[k])}"${errors[k] ? ' aria-invalid="true"' : ''} aria-describedby="co-${k}-e">
      <span class="field-error" id="co-${k}-e">${errors[k] || ''}</span></div>`;
    const draw = () => {
      const lines = Cart.lines();
      if (!lines.length) {
        host.innerHTML = `<div style="padding:56px 0 96px">${UI.empty({ icon: 'cart', title: 'Er is niets om af te rekenen', text: notices.length ? notices.map(esc).join(' ') : 'Uw winkelmand is leeg.', actions: '<a class="btn btn--dark btn--sm" href="#/webshop">Naar de webshop</a>' })}</div>`;
        return;
      }
      const method = methods.find((m) => m.id === form.delivery) || null;
      const t = computeTotals(lines, method ? method.price : 0);
      const v = VehicleStore.get();
      host.innerHTML = `<form class="checkout" data-co-form novalidate>
        <div>
          <h1 class="h3" style="margin-bottom:28px">Afrekenen</h1>
          ${notices.length ? `<div class="notice-stack" style="margin-bottom:24px">${notices.map((n) => UI.notice(esc(n), { type: 'warn', ic: 'alert' })).join('')}</div>` : ''}
          ${Object.keys(errors).length ? `<div class="error-summary" role="alert" tabindex="-1" data-err-summary style="margin-bottom:24px"><strong>Controleer de volgende velden:</strong><ul>${Object.entries(errors).map(([k, m]) => `<li><a href="#co-${k}" data-focus="co-${k}">${esc(m)}</a></li>`).join('')}</ul></div>` : ''}
          <div class="form-section"><h2>Contactgegevens</h2><div class="form-grid">
            ${field('firstName', 'Voornaam', { ac: 'given-name' })}${field('lastName', 'Achternaam', { ac: 'family-name' })}
            ${field('email', 'E-mailadres', { type: 'email', ac: 'email', mode: 'email' })}${field('phone', 'Telefoonnummer', { type: 'tel', ac: 'tel', mode: 'tel' })}
          </div></div>
          <div class="form-section"><h2>Levering</h2>
            ${methods.length ? `<div class="option-cards" role="radiogroup" aria-label="Leveringsmethode">${methods.map((m) => `<label class="option-card">
              <input type="radio" name="delivery" value="${m.id}"${form.delivery === m.id ? ' checked' : ''} data-k="delivery"><span class="oc-radio" aria-hidden="true"></span>
              <span><span class="oc-title">${esc(m.label)}</span><span class="oc-sub" style="display:block">${esc(m.description || '')}</span></span>
              <span class="oc-price">${m.price ? Money.fmt(m.price) : 'Gratis'}</span></label>`).join('')}</div>` : UI.notice('Er zijn geen leveringsmethoden ingesteld.', { type: 'danger', ic: 'alert' })}
            <span class="field-error" id="co-delivery-e">${errors.delivery || ''}</span>
            ${method && method.requiresAddress ? `<div class="form-grid mt-24">
              ${field('street', 'Straat', { ac: 'address-line1', span: false })}${field('houseNumber', 'Huisnummer', { ac: 'off' })}
              ${field('postal', 'Postcode', { ac: 'postal-code' })}${field('city', 'Plaats', { ac: 'address-level2' })}
            </div>` : ''}
          </div>
          <div class="form-section"><h2>Opmerking</h2>
            <div class="field"><label for="co-note">Opmerking bij uw bestelling <span class="opt">(optioneel)</span></label><textarea class="textarea" id="co-note" data-k="note" style="min-height:96px">${esc(form.note)}</textarea></div>
            ${v ? `<p class="hint mt-8">Uw auto (${esc(VehicleStore.name(v))}${v.year ? `, ${v.year}` : ''}) wordt bij de bestelling vermeld, zodat CarTronic de compatibiliteit kan controleren.</p>` : ''}
          </div>
          <div class="form-section"><h2>Betalen</h2>
            <div class="pay-box">${icon('card')}<div><div class="pb-title">Online betalen <span class="pill pill--warn">Testmodus</span></div>
              <p class="pb-text">In deze demo wordt de betaling gesimuleerd; er wordt geen geld afgeschreven. In productie wordt u doorgestuurd naar de beveiligde betaalpagina van Mollie, en bepaalt de server het te betalen bedrag.</p></div></div>
          </div>
          <div class="mt-32 flex wrap gap-12 items-center">
            <button class="btn btn--primary" type="submit" data-submit style="min-width:260px">${icon('lock')} Bestelling plaatsen en betalen</button>
            <a class="link link--ink" href="#/winkelmand">${icon('arrowLeft')} Terug naar winkelmand</a>
          </div>
        </div>
        <aside class="summary-card" aria-label="Uw bestelling">
          <h2>Uw bestelling</h2>
          <div class="summary-lines">${lines.map((l) => `<div class="summary-line"><div class="sl-media">${Media.html(l.product.images[0], l.product.name, { kind: productArtKind(l.product) })}<span class="sl-qty">${l.qty}</span></div>
            <div class="sl-name">${esc(l.product.name)}</div><div class="sl-price">${l.pricing.onSale ? `<small>${Money.fmt(l.lineRegular)}</small>` : ''}${Money.fmt(l.lineTotal)}</div></div>`).join('')}</div>
          ${CartUI.totalsHtml(t, { shippingLabel: method ? method.label : 'Verzending', shippingKnown: !!method })}
          <p class="sc-foot">De bedragen worden bij het plaatsen opnieuw gecontroleerd. In productie berekent de server het definitieve totaal.</p>
        </aside>
      </form>`;
      const summary = $('[data-err-summary]', host);
      if (summary) summary.focus();
    };
    draw();
    const save = () => { const { note, ...rest } = form; Storage.set('checkoutForm', { ...rest, note }, 'session'); };
    host.addEventListener('input', (e) => {
      const k = e.target.dataset.k;
      if (!k || k === 'delivery') return;
      form[k] = e.target.value; save();
      if (errors[k]) { // clear the error as soon as the field is corrected
        const method = methods.find((m) => m.id === form.delivery);
        if (!validateCheckout(form, method)[k]) {
          delete errors[k];
          e.target.removeAttribute('aria-invalid');
          const el = document.getElementById(`co-${k}-e`); if (el) el.textContent = '';
          const li = host.querySelector(`[data-focus="co-${k}"]`); if (li) li.closest('li').remove();
        }
      }
    });
    host.addEventListener('change', (e) => {
      if (e.target.dataset.k === 'delivery') { form.delivery = e.target.value; save(); draw(); $(`input[value="${form.delivery}"]`, host)?.focus(); }
    });
    host.addEventListener('click', (e) => {
      const f = e.target.closest('[data-focus]'); if (f) { e.preventDefault(); document.getElementById(f.dataset.focus)?.focus(); }
    });
    host.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) return; // double-click protection
      const method = methods.find((m) => m.id === form.delivery);
      errors = validateCheckout(form, method);
      if (Object.keys(errors).length) { draw(); return; }
      busy = true;
      const btn = $('[data-submit]', host);
      btn.classList.add('is-loading'); btn.disabled = true; btn.setAttribute('aria-busy', 'true');
      announce('Bestelling wordt aangemaakt');
      const res = await CheckoutService.placeOrder(form);
      busy = false;
      if (!res.ok) {
        if (res.code === 'cart_changed') { notices = res.notices; errors = {}; Toast.show('Uw winkelmand is bijgewerkt. Controleer het overzicht.', { error: true }); }
        else if (res.code === 'invalid') errors = res.errors || {};
        else notices = ['Uw winkelmand is leeg.'];
        draw();
        return;
      }
      Router.go(res.checkoutUrl.replace(/^#/, ''));
    });
  },
};

/* ---------- Order result ---------- */
Pages.orderResult = {
  id: 'order', nav: 'webshop',
  meta: { title: 'Uw bestelling' },
  render(ctx) {
    const o = Repo.order(ctx.params.id);
    if (!o) return Pages.notFound.render(ctx, { title: 'Deze bestelling bestaat niet.' });
    const ps = o.paymentStatus;
    let kind; let eyebrow; let title; let text; let actions;
    if (ps === 'paid') {
      kind = 'ok'; eyebrow = 'Betaling geslaagd'; title = 'Bedankt voor uw bestelling.';
      text = `Bestelling ${esc(o.orderNumber)} is betaald. Dit is een demobestelling: er wordt geen e-mail verstuurd en niets geleverd.`;
      actions = '<a class="btn btn--primary" href="#/webshop">Verder winkelen</a><a class="btn btn--light" href="#/">Naar de homepage</a>';
    } else if (ps === 'pending') {
      kind = 'pending'; eyebrow = 'Betaling wordt verwerkt'; title = 'We wachten op de bevestiging.';
      text = 'Uw betaling is gestart maar nog niet bevestigd. Dat kan enkele minuten duren. Zodra de status bekend is, ziet u die hier.';
      actions = '<button class="btn btn--dark" type="button" data-refresh>Status vernieuwen</button>';
    } else if (ps === 'open') {
      kind = 'pending'; eyebrow = 'Betaling nog niet afgerond'; title = 'Uw bestelling wacht op betaling.';
      text = `Bestelling ${esc(o.orderNumber)} is aangemaakt, maar nog niet betaald.`;
      actions = `<a class="btn btn--primary" href="#/betaling/${o.id}">Ga verder met betalen</a><a class="btn btn--light" href="#/winkelmand">Terug naar winkelmand</a>`;
    } else if (ps === 'failed') {
      kind = 'fail'; eyebrow = 'Betaling mislukt'; title = 'De betaling is niet gelukt.';
      text = 'Er is niets afgeschreven. U kunt het opnieuw proberen; uw winkelmand is bewaard.';
      actions = '<button class="btn btn--primary" type="button" data-retry>Opnieuw betalen</button><a class="btn btn--light" href="#/winkelmand">Terug naar winkelmand</a>';
    } else {
      kind = 'cancel'; eyebrow = 'Betaling geannuleerd'; title = 'U heeft de betaling geannuleerd.';
      text = 'Er is niets afgeschreven. Uw winkelmand is bewaard, zodat u later verder kunt.';
      actions = '<button class="btn btn--primary" type="button" data-retry>Opnieuw betalen</button><a class="btn btn--light" href="#/winkelmand">Terug naar winkelmand</a>';
    }
    const ic = { ok: 'check', pending: 'clock', fail: 'x', cancel: 'arrowLeft' }[kind];
    return `<div class="container"><div class="result">
      <div class="result-head">
        <div class="result-icon result-icon--${kind}" data-result-icon>${icon(ic)}</div>
        <p class="eyebrow">${kind === 'pending' && ps === 'pending' ? '<span class="pulse-dot" aria-hidden="true"></span> ' : ''}${eyebrow}</p>
        <h1>${title}</h1>
        <p>${text}</p>
        <div class="result-actions" data-result-actions>${actions}</div>
      </div>
      ${ps === 'pending' ? `<div class="mt-32">${UI.notice('<strong>Testmodus.</strong> Simuleer hoe de betaalprovider de status later bevestigt (webhook).', { ic: 'info', actions: '<button class="btn btn--dark btn--xs" type="button" data-sim="paid">Webhook: geslaagd</button><button class="btn btn--light btn--xs" type="button" data-sim="failed">Webhook: mislukt</button>' })}</div>` : ''}
      <div class="result-card">
        <div class="rc-head"><div><div class="label">Bestelling ${esc(o.orderNumber)}</div><div class="text-small text-muted">${fmtDateTime(o.createdAt)}</div></div>${orderBadge(o.orderStatus)}</div>
        <div class="rc-body">
          <div class="summary-lines">${o.items.map((l) => `<div class="summary-line"><div class="sl-media">${Media.html(l.image, l.name, { kind: 'box' })}<span class="sl-qty">${l.qty}</span></div><div class="sl-name">${esc(l.name)}<div class="text-small text-muted" style="font-weight:500">${Money.fmt(l.unitPrice)} per stuk${l.discountLabel ? ` · ${esc(l.discountLabel)}` : ''}</div></div><div class="sl-price">${Money.fmt(l.lineTotal)}</div></div>`).join('')}</div>
          ${CartUI.totalsHtml({ subtotalRegular: o.subtotalRegular, discountTotal: o.discountTotal, subtotal: o.subtotal, shipping: o.shipping, total: o.total, vat: o.vat }, { shippingLabel: o.delivery.label, shippingKnown: true })}
          <hr style="margin:20px 0">
          <dl class="kv"><dt>Naam</dt><dd>${esc(`${o.customer.firstName} ${o.customer.lastName}`)}</dd><dt>E-mail</dt><dd>${esc(o.customer.email)}</dd><dt>Levering</dt><dd>${esc(o.delivery.label)}</dd><dt>Betaal-ID</dt><dd><span class="code">${esc(o.paymentId || '—')}</span></dd></dl>
        </div>
      </div>
    </div></div>`;
  },
  mount(root, ctx) {
    root.addEventListener('click', async (e) => {
      if (e.target.closest('[data-refresh]')) {
        const b = e.target.closest('[data-refresh]'); b.classList.add('is-loading');
        await sleep(500);
        const o = Repo.order(ctx.params.id);
        await OrderService.onPaymentWebhook(o.paymentId);
        Router.render({ force: false });
        Toast.show('Status bijgewerkt.');
      }
      const sim = e.target.closest('[data-sim]');
      if (sim) { sim.classList.add('is-loading'); await Payments.simulate(ctx.params.id, sim.dataset.sim); Router.render(); }
      const retry = e.target.closest('[data-retry]');
      if (retry) {
        retry.classList.add('is-loading');
        const r = await CheckoutService.retryPayment(ctx.params.id);
        if (r.ok) Router.go(r.checkoutUrl.replace(/^#/, ''));
        else { retry.classList.remove('is-loading'); Toast.show(r.message, { error: true }); }
      }
    });
    const o = Repo.order(ctx.params.id);
    if (o && o.paymentStatus === 'paid') Analytics.track('order_paid_viewed', { order: o.orderNumber });
  },
};

/* ---------- Validation ---------- */
function validateProduct(p, list = Repo.products()) {
  const e = {};
  if (!String(p.name || '').trim()) e.name = 'Vul een productnaam in.';
  else if (p.name.length > 120) e.name = 'Gebruik maximaal 120 tekens.';
  if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(p.slug || '')) e.slug = 'Gebruik alleen kleine letters, cijfers en koppeltekens.';
  else if (list.some((x) => x.slug === p.slug && x.id !== p.id)) e.slug = 'Deze slug is al in gebruik.';
  if (!String(p.sku || '').trim()) e.sku = 'Vul een artikelnummer (SKU) in.';
  else if (!/^[A-Za-z0-9._-]{2,40}$/.test(p.sku)) e.sku = 'Gebruik 2–40 letters, cijfers, punten of koppeltekens.';
  else if (list.some((x) => x.sku.toLowerCase() === p.sku.toLowerCase() && x.id !== p.id)) e.sku = 'Dit artikelnummer is al in gebruik.';
  if (!String(p.shortDescription || '').trim()) e.shortDescription = 'Vul een korte omschrijving in.';
  if (!isInt(p.regularPrice) || p.regularPrice < 1) e.regularPrice = 'Vul een geldige prijs in, bijvoorbeeld 249,00.';
  else if (p.regularPrice > 9999999) e.regularPrice = 'Deze prijs is te hoog.';
  if (p.discountType === 'sale') {
    if (!isInt(p.salePrice) || p.salePrice < 1) e.salePrice = 'Vul een geldige actieprijs in.';
    else if (isInt(p.regularPrice) && p.salePrice >= p.regularPrice) e.salePrice = 'De actieprijs moet lager zijn dan de normale prijs.';
  }
  if (p.discountType === 'percent' && (!isInt(p.discountValue) || p.discountValue < 1 || p.discountValue > 90)) e.discountValue = 'Kies een percentage tussen 1 en 90.';
  if (p.discountType === 'fixed') {
    if (!isInt(p.discountValue) || p.discountValue < 1) e.discountValue = 'Vul een geldig kortingsbedrag in.';
    else if (isInt(p.regularPrice) && p.discountValue >= p.regularPrice) e.discountValue = 'De korting moet lager zijn dan de normale prijs.';
  }
  if (!['none', 'sale', 'percent', 'fixed'].includes(p.discountType)) e.discountType = 'Ongeldig kortingstype.';
  if (p.startDate && !/^\d{4}-\d{2}-\d{2}$/.test(p.startDate)) e.startDate = 'Ongeldige datum.';
  if (p.endDate && !/^\d{4}-\d{2}-\d{2}$/.test(p.endDate)) e.endDate = 'Ongeldige datum.';
  if (p.startDate && p.endDate && p.endDate < p.startDate) e.endDate = 'De einddatum ligt vóór de startdatum.';
  if (p.trackStock && (!isInt(p.stock) || p.stock < 0 || p.stock > 99999)) e.stock = 'Vul een geldige voorraad in (0 of meer).';
  if (!Repo.shopCategory(p.category)) e.category = 'Kies een categorie.';
  if ((p.images || []).some((i) => !/^(art:|img:|https?:\/\/|data:image\/(png|jpeg|webp);base64,)/i.test(i))) e.images = 'Een afbeelding heeft een ongeldig adres.';
  if (!Object.keys(PRODUCT_TYPES).includes(p.type)) e.type = 'Ongeldig producttype.';
  return e;
}

/* Demo image handling. NOT a secure upload: production uploads go to protected storage with
   server-side validation of file type (magic bytes), size, safe file names and permissions.
   Re-encoding through a canvas here also strips metadata and any non-image payload. */
async function readImageFile(file, maxSide = 1400) {
  const ALLOWED = ['image/png', 'image/jpeg', 'image/webp'];
  if (!file || !ALLOWED.includes(file.type)) throw new Error('Kies een PNG-, JPG- of WebP-afbeelding.');
  if (file.size > 5 * 1024 * 1024) throw new Error('De afbeelding is groter dan 5 MB.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('De afbeelding kon niet worden gelezen.')); i.src = url; });
    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * scale)); c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const ctx2 = c.getContext('2d'); ctx2.fillStyle = '#fff'; ctx2.fillRect(0, 0, c.width, c.height); ctx2.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.84);
  } finally { URL.revokeObjectURL(url); }
}
function downloadJson(name, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
